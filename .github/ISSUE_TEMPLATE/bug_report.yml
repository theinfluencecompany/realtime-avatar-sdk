name: Bug report
description: Something in the SDK behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. A reproducible report gets fixed roughly ten times faster than a
        description of one.

        **Found a security issue?** Don't file it here — see
        [SECURITY.md](https://github.com/theinfluencecompany/realtime-avatar-sdk/blob/main/SECURITY.md).

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "realtime-avatar (server client)"
        - "realtime-avatar-react"
        - "realtime-avatar-proxy"
        - "realtime-avatar-browser"
        - "realtime-avatar-tools"
        - "realtime-avatar-mcp"
        - "An example app under apps/"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        The smallest code that shows it. **Redact your API key** — anything starting `tic_`.
      render: ts
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Node: 22.11.0
        Runtime: Next.js 15 App Router / Cloudflare Workers / Deno / browser only
        Browser + OS: Chrome 141 on macOS 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The full error, including status code if it's an HTTP error.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: "My API key is on the server only — it isn't reaching the browser"
        - label: "I'm relaying `call.raw` untouched, not a reshaped object"
        - label: "I've checked this isn't a `queued` response being treated as an error"
