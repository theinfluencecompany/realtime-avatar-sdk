name: Release realtime-avatar-react

# Publishes realtime-avatar-react (libs/client) to npm.
#
# The wire schemas live inside this package (src/wire.ts), so the published tarball carries
# no workspace:* dep and installs standalone — no monorepo needed at the consumer end.
#
#   - workflow_dispatch (dry_run defaults true) -> build + `npm publish --dry-run`
#   - workflow_dispatch (dry_run false)         -> publish one prerelease on `next`
#
# This lane is MANUAL. It used to fire on every push to main touching libs/client, which
# made "merge a PR" and "publish to npm" the same action — a release is a decision, and a
# trigger that cannot be declined is not one. Cutting a prerelease is now an explicit run.
#
# Versions are unique, NON-committed prereleases (0.0.0-main.<UTC-timestamp>.<sha>);
# the counter is a UTC timestamp, not github.run_number (which resets per repo and
# would regress in semver across any future publisher move). Nothing is git-bumped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (no publish)"
        type: boolean
        default: true

# Shared with release.yml, deliberately. Both files publish libs/client, so separate groups
# would let a prerelease and a real release double-publish that package concurrently.
concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  npm:
    # Publish ONLY from the public repo. This file is carried into it verbatim, so without
    # this guard it runs in both — and a provenance attestation records the source repo and
    # commit into Sigstore's public transparency log, which is append-only and permanent
    # (Linux Foundation Immutable Record). Publishing from the private repo would therefore
    # put its name and SHAs in front of the whole world, irreversibly.
    #
    # npm also requires package.json `repository` to match where you publish from. Ours
    # points at the public repo, so a private-repo publish fails anyway — but failing by
    # accident is not a control, and the failure mode here cannot be walked back.
    if: github.repository == 'theinfluencecompany/realtime-avatar-sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the OIDC token npm exchanges for short-lived publish credentials.
      # Without it, trusted publishing fails with an auth error that looks like a bad token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # No `cache: npm` — measured a net loss on this tree; see ci.yml.
          # No `scope:` — these packages are unscoped. setup-node's scope only writes a
          # `@scope:registry=` line into .npmrc, which would bind a scope nothing uses.
      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10. Pinned to the
      # major rather than `latest`, which is a moving target on the one lane where a surprise
      # is unrecoverable: npm's next major could change `publish` and break releases on a day
      # nothing in this repo changed.
      - run: npm install -g npm@^11.5.1
      # `ci`, not `install` — the prerelease must be built from the committed lockfile.
      - run: npm ci
      # The wire schemas are src/wire.ts inside libs/client now, so there is no sibling
      # package to build first.
      - run: npm run build -w libs/client
      # Same as release.yml: without the denylist this scan reports success having compared
      # the artifact against nothing. A prerelease still ships real bytes to real consumers.
      - name: Materialise the boundary denylist
        env:
          BOUNDARY_TERMS: ${{ secrets.BOUNDARY_TERMS }}
        run: |
          if [ -z "$BOUNDARY_TERMS" ]; then
            echo "::error::BOUNDARY_TERMS is missing - refusing to publish behind a boundary check that would scan against an empty list"
            exit 1
          fi
          printf '%s\n' "$BOUNDARY_TERMS" > scripts/boundary-terms.private.txt
          echo "denylist materialised ($(grep -cvE '^\s*#|^\s*$' scripts/boundary-terms.private.txt) terms)"

      # Re-scan the built artifact before it leaves the runner. Sourcemaps embed original
      # source via sourcesContent, so a clean source tree can still ship a leaky tarball.
      - run: npm run boundary
      # Prefers OIDC, which is what this should be steady-state: the trust relationship is
      # configured on npmjs.com against this repo and this filename, so credentials are
      # short-lived, scoped to this workflow, and cannot be exfiltrated. NPM_TOKEN is the
      # bootstrap fallback only — OIDC cannot publish a package's FIRST version, because the
      # trusted publisher is configured in package settings that do not exist until the name
      # does. Delete the secret once realtime-avatar-react is configured; see release.yml.
      - name: Publish (or dry-run)
        working-directory: libs/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Provenance is opt-in under token auth; OIDC emits it automatically.
            extra="--provenance"
            echo "auth: NPM_TOKEN — bootstrap mode"
          else
            extra=""
            echo "auth: OIDC trusted publishing"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public $extra
          else
            npm pkg set version="0.0.0-main.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
            # --tag is REQUIRED: npm refuses to publish a prerelease without an explicit
            # dist-tag, and this version is always a prerelease. Without it the publish
            # fails at argument validation, before it ever authenticates.
            # `next` also keeps these off `latest`, so `npm i` never resolves to a main build.
            npm publish --access public --tag next $extra
          fi
