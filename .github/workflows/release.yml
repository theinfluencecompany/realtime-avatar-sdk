name: Release all packages

# Publishes the THREE public packages at the version committed in their package.json:
# `realtime-avatar` (libs/sdk-server — the whole SDK; the server half at `.`, `/server` and the
#   route adapters, and the browser half at `/react`, `/react-native`, `/browser`, `/tools`), and
# `realtime-avatar-mcp` (libs/mcp — a CLI whose consumer is a coding agent, and which is run with
#   npx rather than installed, so an APP installs exactly one package).
# The other five workspaces are `private`; their code ships bundled inside the two above.
#
# The browser half was its own npm name until 2026-08-26, on the theory that an exports condition
# could not keep a key out of a client bundle. Measured, that is false — the server subpaths now
# carry `browser`/`react-native` conditions pointing at a module that throws, which is a build
# time guarantee the separate name never gave.
#
# All three names were unpublished on 2026-08-26, so the next run is a FIRST publish for
# each — OIDC cannot mint a first version (the trusted publisher lives in package settings
# that do not exist until the name does), and npm blocks a fully-unpublished name for 24
# hours. An unpublished VERSION is burned permanently, so 0.2.1 can never be reused.
#
# Runs off an annotated `v*` tag, on the `latest` dist-tag. There is no continuous lane:
# a release is a decision, and a trigger you cannot decline is not one.
#
#   git tag -a v0.3.0 -m "0.3.0" && git push origin v0.3.0   -> publish both at 0.3.0
#   workflow_dispatch (dry_run defaults true)                -> build + pack, publish nothing
#
# AUTH, and why there are two modes. Trusted publishing is the destination: npm is
# restricting 2FA-bypassing tokens (account changes Aug 2026, direct publishing Jan 2027),
# so a long-lived NPM_TOKEN is on a deadline. But OIDC **cannot publish a package's first
# version** — the trusted publisher is configured in that package's settings on npmjs.com,
# and those do not exist until the name does (npm/cli#8544). So:
#
#   1. BOOTSTRAP once per package name, with `packages:` naming it and NPM_TOKEN set.
#   2. Configure the trusted publisher on npmjs.com for that package — this repo, and this
#      filename, release.yml.
#   3. Delete NPM_TOKEN. Every later release is OIDC and needs no stored credential.
#
# The publish step picks the mode by whether NPM_TOKEN is present, so one file serves both
# phases and step 3 is a secret deletion rather than an edit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (no publish)"
        type: boolean
        default: true
      packages:
        description: "Workspaces under libs/ to publish, space-separated — or 'all'"
        type: string
        default: all

# A tag push and a manual run must never interleave two publishes of the same version.
concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  npm:
    # Publish ONLY from the public repo — same reasoning as release-react.yml: an OIDC
    # publish writes the source repo and commit into Sigstore's public transparency log,
    # which is append-only and permanent. Naming the private repo there cannot be undone.
    if: github.repository == 'theinfluencecompany/realtime-avatar-sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # No `cache: npm` — measured a net loss on this tree; see ci.yml.
          # No `scope:` — every package here is unscoped.
      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10. Pinned to the
      # major rather than `latest`, which is a moving target on the one lane where a surprise
      # is unrecoverable: npm's next major could change `publish` and break releases on a day
      # nothing in this repo changed.
      - run: npm install -g npm@^11.5.1
      # `ci`, not `install`: a release builds from the committed lockfile. `install` is free
      # to resolve a newer transitive dependency, so the tarball would stop matching the tree
      # CI tested — and an npm version cannot be recalled once that divergence ships.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The suite ci.yml runs. A tag is the last moment a broken build is still cheap to fix.
      - run: npm test

      # ci.yml treats a missing denylist as a hard error on push to main, because "the
      # boundary check would pass without checking anything". This lane had no equivalent and
      # so ran the scan unarmed: run 32932564689 printed `boundary - 180 file(s) scanned, no
      # term list configured` on its way to publishing. The weakest of the three scans was the
      # one guarding the bytes that actually leave for npm, where a mistake cannot be recalled.
      #
      # There is no fork case to accommodate here - the job already refuses to run outside the
      # canonical repo - so a missing secret is a broken release, not a degraded one.
      #
      # Never `cat` this file in a step: Actions masks the secret's value, not a line-by-line
      # dump of it.
      - name: Materialise the boundary denylist
        env:
          BOUNDARY_TERMS: ${{ secrets.BOUNDARY_TERMS }}
        run: |
          if [ -z "$BOUNDARY_TERMS" ]; then
            echo "::error::BOUNDARY_TERMS is missing - refusing to publish behind a boundary check that would scan against an empty list"
            exit 1
          fi
          printf '%s\n' "$BOUNDARY_TERMS" > scripts/boundary-terms.private.txt
          echo "denylist materialised ($(grep -cvE '^\s*#|^\s*$' scripts/boundary-terms.private.txt) terms)"

      # The gate that matters. Scans shipped JS and .d.ts for internal identifiers before
      # anything leaves the runner.
      - run: npm run boundary
      # The other half of the boundary, and the half that scales. `boundary` asks whether
      # anything shipped mentions a term we listed; this asks whether every name we export
      # is one we meant to export. A new internal export fails by default.
      - run: npm run surface

      # The list below is written out rather than globbed, so it has to be kept in step by
      # hand — and the failure is silent in both directions: a new lib never ships, or one
      # meant to stay internal does. This asserts the list IS the set of publishable
      # workspaces before a tag can act on it.
      - name: Verify the publish list matches the non-private workspaces
        run: |
          set -euo pipefail
          expected=$(node -e '
            const {readdirSync,readFileSync}=require("node:fs");
            const dirs=readdirSync("libs").filter(d=>{
              try { return !JSON.parse(readFileSync(`libs/${d}/package.json`)).private } catch { return false }
            });
            console.log(dirs.sort().join(" "));
          ')
          actual=$(printf "%s\n" sdk-server mcp examples | sort | tr "\n" " " | sed "s/ $//")
          if [ "$expected" != "$actual" ]; then
            echo "::error::publish list is [$actual] but the non-private workspaces are [$expected]"
            exit 1
          fi
          echo "publish list matches: $actual"

      # BEFORE publishing, not after: a tag that disagrees with what the packages declare
      # would otherwise ship 0.2.1 under a v0.3.0 tag, and npm versions cannot be recalled.
      - name: Verify the tag matches the declared versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for dir in sdk-server mcp examples; do
            version=$(node -p "require('./libs/$dir/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::libs/$dir is $version but the tag says $tag"
              fail=1
            fi
          done
          exit $fail

      # Dependency order, not alphabetical: mcp declares a real `realtime-avatar` dependency,
      # so publishing it before libs/sdk leaves a window where `npm i` on it resolves nothing.
      # The other five workspaces are `private` now — their code ships inside libs/sdk.
      #
      # Each package is skipped if that exact version is already on the registry, so a
      # re-run after a partial failure completes the set instead of aborting on the first
      # already-published name. npm would reject the duplicate anyway (E403), and a
      # half-published tag is the state you most want to be able to retry.
      - name: Publish (or dry-run)
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || 'all' }}
          # setup-node already wrote the .npmrc line that reads this. Empty once every name
          # has a trusted publisher configured, which is the intended steady state.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ALL="sdk-server mcp examples"

          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Token auth: provenance is opt-in, so ask for it. On an OIDC publish npm emits
            # provenance automatically and the flag is redundant rather than harmful.
            extra="--provenance"
            echo "auth: NPM_TOKEN — bootstrap mode"
          else
            extra=""
            echo "auth: OIDC trusted publishing"
          fi

          # A typo'd selection must not quietly publish nothing and report success.
          if [ "$SELECTED" != "all" ]; then
            for want in $SELECTED; do
              case " $ALL " in
                *" $want "*) ;;
                *) echo "::error::unknown workspace '$want' — expected some of: $ALL"; exit 1 ;;
              esac
            done
          fi

          # Dependency order, not alphabetical (see above). Filtering the canonical order by
          # the selection preserves that order however the input happens to be written.
          for dir in $ALL; do
            if [ "$SELECTED" != "all" ]; then
              case " $SELECTED " in *" $dir "*) ;; *) continue ;; esac
            fi
            name=$(node -p "require('./libs/$dir/package.json').name")
            version=$(node -p "require('./libs/$dir/package.json').version")
            # BEFORE the dry-run branch, not after. `--dry-run` still contacts the registry
            # and still fails with "cannot publish over the previously published versions",
            # so a dry run of an already-released version reports failure for the one case
            # the real run handles fine. A dry run has to model what the real run does, and
            # what it does here is skip.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "· $name@$version already published — skipping"
              continue
            fi
            if [ "$DRY" = "true" ]; then
              echo "::group::dry-run $name@$version"
              ( cd "libs/$dir" && npm publish --dry-run --access public $extra )
              echo "::endgroup::"
              continue
            fi
            echo "::group::publish $name@$version"
            ( cd "libs/$dir" && npm publish --access public $extra )
            echo "::endgroup::"
          done
