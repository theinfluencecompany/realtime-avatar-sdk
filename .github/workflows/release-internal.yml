name: Publish to GitHub Packages

# The INTERNAL lane. Deliberately the opposite of `release.yml` in every respect that matters:
#
#   release.yml    ->  registry.npmjs.org    tag-triggered, explicit semver, PUBLIC, permanent.
#   this workflow  ->  npm.pkg.github.com    every push to main, throwaway version, private.
#
# It exists so a first-party consumer can use this package BEFORE the public name is available.
# `realtime-avatar` was unpublished on 2026-08-26 and npm blocks a fully-unpublished name for 24
# hours, so the public registry is simply not an option until that window opens — and after it
# opens, a first-party build still should not wait for a human to cut a version.
#
# NAME. The committed name is the bare `realtime-avatar`, which is the public identity and what
# every doc and example says to install. GitHub Packages cannot host it: its registry requires
# the name be scoped to the owning org and rejects an unscoped publish outright. So the publish
# step rewrites the name IN THE RUNNER ONLY. Nothing is committed, and a consumer keeps writing
# `import ... from "realtime-avatar"` by installing under an npm alias:
#
#   "realtime-avatar": "npm:@theinfluencecompany/realtime-avatar@sdk"
#
# DIST-TAG is `sdk` — not `latest`, and not `platform`. The platform repo publishes the same
# scoped name under `platform` during the migration; two publishers claiming one tag would fight
# over it and whichever ran last would reach every consumer of that tag. Separate tags make each
# side opt-in. Flip to `latest` only when one publisher remains.

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "spec/**"
      - ".github/workflows/release-internal.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (no publish)"
        type: boolean
        default: true

# A push and a manual run must never publish the same version twice.
concurrency:
  group: release-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run messages` walks history; a shallow clone resolves the range to nothing and
          # passes vacuously.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@theinfluencecompany"

      - run: npm ci

      # The full gate, not a subset. An internal consumer gets the same guarantees as a public
      # one — including reachable, externals, derivation and spec:verify, each of which has
      # caught something that build-and-test did not.
      - run: npm run check

      - name: Publish (or dry-run)
        working-directory: libs/sdk-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI-only, never committed. Set BEFORE the dry-run too, or the dry-run validates a
          # publish that could not actually happen.
          npm pkg set name="@theinfluencecompany/realtime-avatar"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
          else
            # A UTC timestamp rather than github.run_number, for the reason the platform repo
            # learned the hard way: run_number is per-repository and resets to 1, so a publisher
            # moving between repos silently regresses in semver. A timestamp is monotonic across
            # any such move.
            npm pkg set version="0.0.0-main.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
            npm publish --tag sdk
          fi
