name: CI
on:
  push: { branches: [main] }
  pull_request:

# Supersede a PR's own in-flight run when it is pushed again — the older run is checking a
# tree nobody will merge. NOT on main: every commit that lands there has to be checked on its
# own, and cancelling one leaves a green branch with an unverified commit in its history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the packages declare in `engines`, and current LTS.
        node: ["20", "22"]
    steps:
      # fetch-depth: 0 — the commit-message scan needs the range vs main.
      # At the default depth 1 it resolves to nothing and passes vacuously.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # No `cache: npm` here, and that is measured rather than an omission. ~/.npm for this
      # tree is 71MB, which takes ~7.5s to restore, while a warm cache saves only 2-5s of
      # `npm ci` — most of that step is linking, not downloading. Three paired runs on
      # release.yml: uncached setup+install 12.0s, cached 16.4s and 14.3s. Re-measure before
      # adding it back; the answer flips once the dependency tree is big enough.
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      # Materialise the denylist from a secret. It is NOT in this repo by design — the list
      # is an inventory of what is private, so shipping it would leak the thing it protects.
      #
      # Threat model, because the availability is deliberately uneven:
      #   - same-repo PR / push to main -> secret present -> the boundary is ENFORCED. This is
      #     the branch that matters: a maintainer is the only one who can introduce an internal
      #     term, because they are the only one who knows any.
      #   - fork PR -> GitHub withholds the secret -> the scan reports "no term list" and
      #     passes. Correct, not a gap: an outside contributor cannot leak an inventory they
      #     have never seen, and handing every fork the list to prove it would BE the leak.
      #
      # Never `cat` this file in a step. Actions masks the secret's value in logs, but only
      # the value — a line-by-line dump reveals it one term at a time.
      - name: Materialise the boundary denylist
        env:
          BOUNDARY_TERMS: ${{ secrets.BOUNDARY_TERMS }}
        run: |
          if [ -n "$BOUNDARY_TERMS" ]; then
            printf '%s\n' "$BOUNDARY_TERMS" > scripts/boundary-terms.private.txt
            echo "denylist materialised ($(grep -cvE '^\s*#|^\s*$' scripts/boundary-terms.private.txt) terms)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::BOUNDARY_TERMS is missing on a push to main — the boundary check would pass without checking anything"
            exit 1
          else
            echo "::warning::no denylist (fork PR) — the boundary check is advisory on this run"
          fi
      - run: npm install
      - run: npm run typecheck
      # Build BEFORE test: libs/proxy resolves the client through node_modules, so its
      # tests need the built dist. This ordering caught a real failure on first CI run.
      - run: npm run build
      # Tests are TypeScript run through --experimental-transform-types, which does not exist
      # before Node 22.6 — on 20 the flag is a hard `bad option` exit, not a skip. Node 20
      # is in this matrix to prove the SHIPPED artifact honours the `engines` floor, and
      # typecheck + build + boundary above are what actually prove that: `dist` is plain
      # JS, so a consumer on 20 never runs this suite.
      - run: npm test
        if: matrix.node != '20'
      # Scans shipped JS, .d.ts AND sourcemaps. A sourcemap's sourcesContent embeds the
      # original source, so a clean source tree can still publish a leaky artifact.
      - run: npm run boundary
      # The half the file scan cannot reach. A commit message ships nothing, so it has
      # always passed here — and GitHub pins the branch head at refs/pull/<n>/head before
      # any check runs, keeps it through force-pushes, and refuses to let a push delete it.
      # Pre-merge is the only moment this is fixable.
      - run: npm run messages
      # The other half of the boundary, and the half that scales. `boundary` asks whether
      # anything shipped mentions a term we listed; this asks whether every name we export
      # is one we meant to export. A new internal export fails by default.
      - run: npm run surface
      # The vendored spec must still equal what the platform serves. Non-blocking when the
      # network is unreachable — a fork or an in-flight deploy must not redden someone's PR.
      - run: npm run spec:check

      # Both of these are in `npm run check` too. CI lists steps individually so a failure names
      # itself in the UI — the cost is that a new gate has to be added in both places, and these
      # two were added to `check` and missed here.
      - name: No source file is reachable from nothing
        run: npm run reachable

      - name: The generated types still match the vendored spec
        run: npm run spec:verify

      # The Python examples are not typechecked by anything above, and a Python file that
      # PARSES can still die at import (a name used before it is defined). Install what the
      # examples declare, then import every one of them — see scripts/check-python-apps.py.
      - name: Every Python example imports
        run: |
          python3 -m pip install --quiet -r apps/quickstart/python-fastapi/requirements.txt
          npm run apps:python
      # Cheap, catches the obvious: no credential should ever reach a commit here.
      - name: Scan for leaked credentials
        run: |
          if grep -rInE '(tic_(live|test)_[A-Za-z0-9]{8,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' \
             --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "::error::possible credential committed"; exit 1
          fi
          echo "no credential patterns found"
