        const k = keyName(e);
        if (!k) return;
        if (e.metaKey || (e.ctrlKey && k !== "C-b")) return;   // leave the browser's own keys alone
        e.preventDefault();

        const arrowsAsMotion = { Left: "h", Right: "l", Up: "k", Down: "j" };
        const eff = !Tmux.prefix && arrowsAsMotion[k] ? arrowsAsMotion[k] : k;
        // Captured BEFORE the key lands: whether this keystroke was text or a command is a fact
        // about the mode it was pressed in, and `apply` is about to change that mode.
        const wasInsert = Tmux.buf().mode === "insert";
        const label = apply(eff);
        // Two different records from one keystroke. The keycast shows the letter, because that
        // is the teaching aid; `sinceHandover` collapses a whole typed word to one token,
        // because a lesson asking "did they press i" must not be satisfied by them TYPING an
        // "i" inside insert mode — and he does not need the letters either way.
        const recorded = arrowsAsMotion[k] && !Tmux.prefix ? `<${k}>`
          : wasInsert && label && label !== "Esc" ? "<text>"
          : label;
        if (label || recorded) { Keys.push(label ?? k); }
        if (recorded) {
          // Bounded for the same reason `Activity` is: only the tail is ever read, and a
          // learner can hold a key for a long time between one hand_over and the next.
          sinceHandover.push(recorded);
          if (sinceHandover.length > 200) sinceHandover.splice(0, sinceHandover.length - 200);
          Activity.note(recorded);
        }
        scheduleRender();
      });

      // Clicking the glass gives it the keyboard back.
      $("stage").addEventListener("mousedown", () => $("say").blur());

      /* ══════════════════════════════════════════════════════════════════════════════════
         THE CALL
      ══════════════════════════════════════════════════════════════════════════════════ */
      let room = null;
      let sessionId = null;
      const sentByUs = new Set();

      // The slot is held from the moment the grant lands — BEFORE the room exists. A tab closed
      // in that gap tells nobody, and the seat stays taken until the join timeout notices.
      // `pagehide` + sendBeacon is the one goodbye that outlives a closing page.
      addEventListener("pagehide", () => {
        if (sessionId) navigator.sendBeacon("/api/end", JSON.stringify({ session_id: sessionId }));
      });

      $("call").onclick = async () => {
        $("call").disabled = true;
        cap("starting…");

        const res = await fetch("/api/call", { method: "POST" });
        if (res.status === 429) {
          const q = await res.json();               // the queue, not a failure
          cap(`every seat is busy — you are ${q.position ?? "?"} in line, retrying…`);
          setTimeout(() => { $("call").disabled = false; $("call").click(); }, q.retryAfterMs ?? 3000);
          return;
        }
        if (res.status === 402) { cap("this key is out of credits.", true); $("call").disabled = false; return; }
        if (!res.ok) { cap(`could not start (${res.status})`, true); $("call").disabled = false; return; }

        const grant = await res.json();             // the grant, read by its wire keys
        sessionId = grant.session_id;               // held from HERE — the beacon needs it now
        room = new Room();

        // BEFORE connect, and INTO the document. `track.attach()` hands back a detached element:
        // left out of the DOM there is nothing to play and nothing to click when autoplay blocks
        // it. Subscribing after connect also drops tracks that arrive during it — a race that
        // only shows up on a fast connection, and shows up as a silent call rather than an error.
        attachRemoteAudio(room, {
          onPlaybackBlocked: (unblock) => {
            // Called once at attach time too, before anything is blocked — so only the BLOCKED
            // case says anything. Reporting the clear case here would overwrite "starting…"
            // with "connected" while the connect is still in flight.
            if (!unblock) return;
            cap("click anywhere to let the sound play");
            addEventListener("pointerdown", () => { unblock(); cap("connected — he has the floor."); },
              { once: true });
          },
        });

        room.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === Track.Kind.Video) {
            track.attach($("kit"));
            $("kit").classList.add("on");
            // The dimensions are not there at attach time — the element has no frame yet. Both,
            // because a track that is already flowing may never fire `loadedmetadata` again.
            $("kit").addEventListener("loadedmetadata", () => { fitKit(); Ink.redraw(); }, { once: true });
            fitKit();
          }
        });
        room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
          const mine = participant?.identity === room.localParticipant.identity;
          for (const s of segments) {
            if (!s.final) continue;
            if (mine && sentByUs.delete(s.text)) continue;   // our own typed turn, echoed back
            log(mine ? "you" : "kit", s.text, mine ? "" : "his");
          }
        });
        room.on(RoomEvent.Disconnected, () => {
          cap("call ended");
          $("hang").disabled = $("say").disabled = true;
          $("call").disabled = false;
          phase = "idle"; hud();
          room = null; sessionId = null;
        });

        await room.connect(grant.livekit_url, grant.participant_token);

        // Registered BEFORE the microphone is asked for. His brief tells him to open the moment
        // he connects, so he is already reaching for next_lesson while a permission prompt is
        // a human deciding — and that human can hold the await for fifteen seconds. Anything
        // waited on before the manifest is armed is time he spends calling tools that are not
        // there, which from the outside is a terminal that stays blank while he talks.
        try {
          const reg = await attachAvatarTools(room, TOOLS, {
            timeoutMs: 15000,
            onInvoke: (name, args) => log("→", `${name}${args && Object.keys(args).length ? " " + JSON.stringify(args) : ""}`, "t"),
          });
          log("tools", `armed: ${reg.accepted.join(", ") || "(none)"}`, "t");
          // A rejected tool is silently uncallable, which reads exactly like his ignoring it.
          for (const r of reg.rejected) log("tools", `REJECTED ${r.name}: ${r.reason}`, "t");
        } catch (err) {
          log("tools", `not armed: ${err.message}`, "t");
          cap("his tools did not arm — he can talk, but he cannot draw.", true);
        }

        const mic = await enableMicrophone(room);
        if (!mic.ok) cap(`connected, but the microphone did not start (${mic.reason}). ${mic.hint}`, true);
        else cap("connected — he has the floor. Click the terminal to type into it.");

        $("stage").classList.add("on");
        $("hang").disabled = $("say").disabled = false;
      };

      $("say").addEventListener("keydown", async (e) => {
        if (e.key !== "Enter" || !room || !$("say").value.trim()) return;
        const text = $("say").value.trim();
        $("say").value = "";
        log("you", text);
        sentByUs.add(text);
        await room.localParticipant.sendText(text, { topic: "lk.chat" });
      });

      $("hang").onclick = () => room?.disconnect();

      // ── boot ──
      const clock = () => {
        const d = new Date();
        $("clock").textContent = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      };
      clock(); setInterval(clock, 20000);
      fitKit();               // compose the empty frame too, not just the one with him in it
      loadScene(one());
      hud();
      $("stage").classList.add("on");

      /**
       * The whole loop, without spending a call.
       *
       * `highlight` and `check` are the two things worth seeing here and both are reachable
       * only through a live session, which makes "does the drawing look right" and "does this
       * lesson actually pass" questions you have to pay to ask. From the console:
       *
       *   tutor.play("ciw")     watch a lesson demonstrate itself
       *   tutor.handOver()      take the keyboard, as he would hand it to you
       *   tutor.check()         what he would be told about what you just did
       *   tutor.draw("text:delay", "circle")
       *   tutor.screen()        every target that resolves right now
       */
      window.tutor = {
        draw: (target, style) => { flushRender(); return VERBS.highlight.execute({ target, style }); },
        clear: () => Ink.clear(),
        screen: () => Screen.list(),
        check: () => VERBS.check.execute({}),
        handOver: () => VERBS.hand_over.execute({}),
        lessons: LESSONS.map((l) => l.id),
        play(id) {
          const L = LESSONS.find((x) => x.id === id);
          if (!L) return `no lesson "${id}" — try one of ${LESSONS.map((x) => x.id).join(", ")}`;
          li = LESSONS.indexOf(L);
          phase = "demo"; loadScene(L.scene()); hud(); play(L.demo, hud);
          return L.title;
        },
      };
    </script>
  </body>
</html>
