             and `device-in-use` on a call the page itself broke. */
          meterStop?.(); testTrack?.stop(); testTrack = null;
          const wantedMic = micChoice;
          let mic = await enableMic(wantedMic);
          if (!mic.ok && wantedMic && mic.reason === "no-device") {
            // Unplugged between the test and the start. A call on the default microphone beats a
            // call with none, and the rail says which one is actually live.
            Trace.err("mic device", `the selected input is gone — falling back to the OS default`);
            mic = await enableMic(null);
          }
          if (!mic.ok) {
            micFailed(mic, "in call");
            $("err").textContent = `${mic.message} — ${mic.hint}`;
          }
          const micTrack = room.localParticipant.getTrackPublication("microphone")?.track;
          if (micTrack) runMeter(micTrack, "in-call");
          else if (mic.ok) { micState("no track", true); $("micmsg").textContent = "No microphone track"; }

          /* Everything above can succeed and she can still never say a word: the grant is fine,
             the room is fine, the tools are registered, and her worker simply does not open. That
             failure used to look exactly like a failure to connect, so it gets its own message and
             its own ERR row rather than leaving "Connecting…" on screen forever. */
          silenceTimer = setTimeout(function verdict() {
            /* Two independent signals — is a transcript arriving, and is there any audio energy —
               and the four combinations are four different bugs. The one that used to be missed
               is BOTH-but-silent: transcripts land, tools fire, the page looks completely healthy
               and not one sample of speech is ever rendered. Measured cause: a `voice` whose id
               the engine accepts and cannot synthesise. Nothing else reports it. */
            const audible = herPeak > .01;
            if (herSpoke && audible) return;
            /* A tool call is proof of life, and a stronger one than either signal above. Her
               worker opens in a couple of seconds on a quiet platform and has been measured at
               over a minute on a busy one, so a fixed deadline on its own calls a slow start a
               dead call. If she is reaching for tools she is alive and the wait is just a wait —
               so say that, and look again rather than accusing her. */
            if (Object.values(ToolStat).some((s) => s.calls)) {
              status("She is working — tools are firing — but her voice has not arrived yet.");
              silenceTimer = setTimeout(verdict, SILENCE_MS);
              return;
            }
            const pinned = voicePreset ? ` The call pinned the voice "${voicePreset}" — a voice `
              + `the engine accepts but cannot render is silent exactly like this.` : "";
            if (herSpoke) {
              status("Her words are arriving but no sound is." + pinned);
              return void Trace.err("transcript but no audio",
                `her audio peak ${(herPeak*1000).toFixed(0)} — the track is subscribed and carrying `
                + `nothing${voicePreset ? ` · voice "${voicePreset}"` : ""}`);
            }
            status(audible
              ? "She is speaking — but no transcript is arriving, so her words cannot be shown."
              : "Connected, tools registered — but she has not made a sound. Check the rail: "
                + "ROOM rows show the join, SAY rows would be her transcript." + pinned);
            Trace.err(audible ? "speech but no transcript" : "no speech",
              `${Math.round(SILENCE_MS/1000)}s after tools registered · her audio peak `
              + `${(herPeak*1000).toFixed(0)} · grant, room and registration all succeeded`);
          }, SILENCE_MS);
        } catch (e) {
          /* Tear the room down on the way out. Anything that threw after `room.connect` used to
             leave the room joined and the session billing, with the End button still disabled —
             and a disabled button does nothing when you click it, so there was no way to hang up
             from the page at all. The beacon covers the session the server minted for us. */
          const why = String(e.message ?? e);
          Trace.err("start", why);
          stopCallMeters();
          try { await room?.disconnect(); } catch {}
          if (sessionId) { navigator.sendBeacon("/api/end", JSON.stringify({ session_id: sessionId }));
            sessionId = null; }
          room = null;
          clearTimeout(silenceTimer); herSpoke = false;
          $("err").textContent = why;
          $("call").disabled = false; $("leave").disabled = true;
          $("says").textContent = "Could not connect.";
        }
      };
      /* End answers the click, THEN hangs up.
         `disconnect()` is async and everything visible used to wait on `RoomEvent.Disconnected`,
         so the button did nothing you could see until the room came back — and the meters this
         call started were still eating frames the whole time, which is precisely when a page has
         the least to spare. Acknowledge first, stop the per-frame work second (it is what frees
         the thread), and only then start the teardown. */
      $("leave").onclick = () => {
        Trace.fx("leave clicked");
        $("leave").disabled = true;
        herSpoke = false;
        $("says").textContent = "Ending…";
        clearTimeout(silenceTimer);
        stopCallMeters();
        room?.disconnect();
      };
      addEventListener("pagehide", () => {
        if (sessionId) navigator.sendBeacon("/api/end", JSON.stringify({ session_id: sessionId })); });

      async function refreshSpend() {
        try { const s = await (await fetch("/api/spend")).json(); if (s.error) return;
          $("spend").textContent = `${s.calls} calls · ${s.seconds}s on air · ${s.credits} credits`;
        } catch {}
      }
      refreshSpend();
      hud();
      preview();   // never open on an empty workspace — show the restored level straight away

      /* Exposed on purpose: this demo is about the registry, and driving the six verbs from the
         console — `__ms.TOOLS.next_task.execute({})` — exercises every manipulative without
         placing a billed call. `__ms.MANIPULATIVES` is where you hot-plug a new one. */
      window.__ms = { Trace, TOOLS, MANIPULATIVES, CURRICULUM,
                      // the live Room, because "she connected but said nothing" is only
                      // diagnosable from the console with the participants in front of you
                      get room() { return room; },
                      get level() { return level; }, set level(l) { level = l; hud(); },
                      get task() { return task; }, get active() { return active; } };
      Trace.fx("ready", `${TOOL_NAMES.length} tools · ${Object.keys(MANIPULATIVES).length} manipulatives · ${CURRICULUM.length} levels`);
    </script>
  </body>
</html>
