<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Math Studio</title>
    <style>
      :root {
        --ink:#20222a; --dim:#7f869a; --line:#e8eaf0; --red:#ef5b3f; --blue:#3b7ce0;
        --gold:#ffb224; --grass:#28a86b; --plum:#a469d6; --card:#fff;
        --pop:cubic-bezier(.34,1.56,.64,1); --settle:cubic-bezier(.22,.61,.36,1);
        --rail:420px;

        /* ── the room ────────────────────────────────────────────────────────────
           The only tokens the theme switches. The board stays white in both, because a
           manipulative is ink on paper and always will be — what changes is the light in
           the room around it. That is also where the hierarchy now comes from: three white
           cards on cream had nothing to be the subject of. */
        --room:#14161c; --room-2:#1c1f27; --room-ink:#eef1f7; --room-dim:#8f98ab;
        --room-line:#2b2f3a; --room-chip:#242835; --room-chip-ink:#c9cedb;
        --deep:#08090c;
        --shell-shadow:0 34px 80px -26px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05);
        --board-shadow:0 22px 50px -20px rgba(0,0,0,.66);
        --scrim:linear-gradient(180deg, rgba(16,18,24,.8) 0 14%, rgba(16,18,24,0) 34%,
                                        rgba(16,18,24,.14) 50%, rgba(16,18,24,.95) 100%);
      }
      body.lite {
        --room:#e3ded1; --room-2:#f4f1e9; --room-ink:#20222a; --room-dim:#6f7686;
        --room-line:#d2ccbc; --room-chip:#fff; --room-chip-ink:#4a5160;
        --deep:#cdc6b4;
        --shell-shadow:0 30px 64px -26px rgba(66,54,34,.55), 0 0 0 1px rgba(66,54,34,.1);
        --board-shadow:0 18px 40px -20px rgba(66,54,34,.45), 0 2px 6px rgba(66,54,34,.1),
                       0 0 0 1px rgba(66,54,34,.07);
        /* Still a dark scrim in the light theme: her caption sits on a photograph either way,
           and white on a darkened photograph is the only thing that stays legible when the
           photograph itself changes from a teacher to a monkey king. */
        --scrim:linear-gradient(180deg, rgba(24,20,14,.6) 0 14%, rgba(24,20,14,0) 32%,
                                        rgba(24,20,14,.1) 48%, rgba(24,20,14,.86) 100%);
      }
      /* The room's chip surface is white in the light theme, so "selected" cannot also be white. */
      body.lite .lvbtn { background:var(--ink); color:#fff; }
      body.lite .lvbtn.open { background:var(--gold); color:#4a3000; }
      body.lite .chip { box-shadow:0 0 0 1px rgba(66,54,34,.09); }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body { margin:0; height:100%; overflow:hidden; background:var(--deep);
        color:var(--room-ink); transition:background .25s;
        font:16px/1.5 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif; }
      /* The page is an app shell, not a document — and one object, not three. The two halves live
         inside a single rounded container with the room showing around it: she was flush to the
         window on the left, the board was a separate sheet on the right, and the two read as
         unrelated panels that happened to be adjacent. */
      body { display:flex; }
      #main { flex:1 1 auto; min-width:0; height:100vh; overflow:hidden; display:flex; }
      #cam { will-change:transform; flex:1 1 auto; min-width:0; display:flex;
             padding:clamp(8px, 1.4vmin, 18px); }
      .wrap { flex:1 1 auto; min-width:0; min-height:0; display:grid;
              grid-template-columns:clamp(250px,28vw,440px) minmax(0,1fr);
              /* An explicit row, because an auto one is sized by its tallest content: her panel
                 asks for portrait plus controls, gets it, and overflows the window instead of the
                 portrait giving up the height it was always meant to give up. */
              grid-template-rows:minmax(0, 1fr);
              /* A ceiling on the whole composition, centred in the room. Without it a tall window
                 stretched her panel to two thousand pixels and the sheet floated in the middle of
                 an ocean. Below this height nothing letterboxes and nothing changes. */
              max-height:min(100%, 1000px); margin:auto 0;
              background:var(--room); border-radius:22px; overflow:hidden;
              box-shadow:var(--shell-shadow); }
      #resizer { flex:0 0 6px; cursor:col-resize; background:var(--room-line); position:relative; z-index:21; }
      #resizer:hover, #resizer.drag { background:var(--gold); }

      button { font:inherit; border-radius:12px; cursor:pointer; border:0; background:var(--ink);
               color:#fff; padding:9px 16px; font-weight:650;
               box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .09s var(--settle), box-shadow .09s; }
      button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,.18); }
      button:disabled { opacity:.38; cursor:default; box-shadow:none; }

      /* ══ HER HALF ═════════════════════════════════════════════════════════════
         Floor to ceiling, flush to the window edge, no card and no padding around it. She is
         not an element on the page, she is one of its two halves. The version where she sat in
         a 300px card above a microphone picker read as a placeholder — and for the whole time
         no call was running, that is exactly what it was: an empty grey rectangle. */
      .person { position:relative; display:flex; flex-direction:column; min-width:0;
                background:var(--room-2); overflow:hidden; }
      /* Her portrait is bound to a ratio, not to a fraction of the viewport. The track is 1:1 and
         `cover` crops the sides, so the taller the slot the more it crops — at 1:2 you are looking
         at a nose. Tying the height to the column's own width caps the crop at 1:1.45 whatever
         the window does; the max-height is the second belt, for very wide columns. Any slack goes
         to the panel below, which is the same colour and so does not read as a hole.

         `width:100%` is load-bearing and not redundant. A flex item with `aspect-ratio` whose
         height is then clamped by `max-height` leaves two readings available: keep the stretched
         width and let the box grow wider than the ratio, or run the ratio backwards and shrink
         the width to match the clamped height. Chrome takes the first. Something else — reported
         on Safari — takes the second, and the portrait then narrows the moment `max-height` bites,
         showing the column's own background as a bar down the right of her. An explicit width is
         definite, so the ratio has only the height left to decide and the reading stops mattering. */
      .face { position:relative; flex:0 1 auto; width:100%; align-self:stretch;
              aspect-ratio:1 / 1.45;
              max-height:min(62vh, 560px); min-height:190px; background:#0d0f14; }
      video,.still { position:absolute; inset:0; width:100%; height:100%; display:block;
                     object-fit:cover; object-position:center 24%; background:#0d0f14; }
      .scrim { position:absolute; inset:0; background:var(--scrim); pointer-events:none; }
      .ring { position:absolute; inset:0; border:0 solid var(--gold); pointer-events:none;
              transition:border-width .12s; }
      .ring.on { border-width:5px; }
      .brand { position:absolute; top:0; left:0; right:78px; padding:14px 17px; color:#fff; }
      .brand b { display:block; font-size:15.5px; letter-spacing:-.01em; }
      .brand s { text-decoration:none; font-size:11.5px; color:rgba(255,255,255,.62); }
      /* Choosing a teacher happens on the teacher, not in a settings panel underneath one. A
         column down the right of the portrait, out of the caption's way and out of the brand's. */
      .whorow { position:absolute; top:13px; right:13px; z-index:3;
                display:flex; flex-direction:column; gap:9px; }
      .who { background:transparent; border:0; border-radius:50%; padding:0; cursor:pointer;
             box-shadow:none; line-height:0; }
      .who img { width:46px; height:46px; border-radius:50%; display:block; object-fit:cover;
                 opacity:.6; border:2px solid rgba(255,255,255,.45);
                 box-shadow:0 3px 12px rgba(0,0,0,.45);
                 transition:opacity .16s, border-color .16s, transform .16s var(--pop); }
      .who:hover img { opacity:.92; transform:scale(1.06); }
      .who.on img { opacity:1; border-color:var(--gold); border-width:3px; }
      .talk { position:absolute; bottom:0; left:0; right:0; padding:16px 17px 18px; color:#fff; }
      .talk .name { font-size:11.5px; font-weight:750; letter-spacing:.07em; text-transform:uppercase;
                    color:var(--gold); }
      .says { margin-top:6px; font-size:14.5px; line-height:1.45; color:#f2f4f9; min-height:44px; }

      /* Everything about *her* is under her: who is teaching, which voice, which microphone,
         and the button that calls her. Nothing about the maths is in here. */
      /* Under her: the button that calls her, and everything else folded away. Expanded, this
         panel was taller than the portrait above it — a column of configuration with a face on
         top. Collapsed it is one button and one line.

         It never shrinks: the face gives up its height first, because a squashed set of controls
         is unusable and a shorter portrait is only a shorter portrait. Any slack left under it
         shows `.person`, which is the same colour, so it reads as one panel and not as a hole. */
      .foot { flex:0 0 auto; padding:11px 13px 12px; background:var(--room-2);
              border-top:1px solid var(--room-line); display:flex; flex-direction:column; gap:9px; }
      .frow { display:flex; align-items:center; gap:7px; }

      /* One disclosure for the voice and the microphone. `<details>` rather than a
         hand-rolled toggle: it is keyboard-operable and it holds no state of its own. */
      .setup { border-radius:11px; background:var(--room-chip); }
      .setup > summary { list-style:none; cursor:pointer; padding:8px 11px; font-size:11.5px;
                         font-weight:650; color:var(--room-chip-ink); display:flex;
                         align-items:center; gap:6px; border-radius:11px; }
      .setup > summary::-webkit-details-marker { display:none; }
      .setup > summary b { font-weight:650; overflow:hidden; text-overflow:ellipsis;
                           white-space:nowrap; }
      .setup > summary i { font-style:normal; margin-left:auto; opacity:.55; font-size:9px;
                           transition:transform .2s; }
      .setup[open] > summary i { transform:rotate(180deg); }
      .setup .body { display:flex; flex-direction:column; gap:7px; padding:1px 9px 9px; }
      .setup.warn > summary { color:#e8503a; }

      #voicesel { font:inherit; font-size:11.5px; font-weight:650; border-radius:11px; padding:7px 8px;
                  border:0; background:var(--room-2); color:var(--room-chip-ink); width:100%; }
      #voicesel.ph { color:#e8503a; }
      #call { flex:1 1 auto; background:var(--grass); box-shadow:0 4px 0 #177049; border-radius:999px;
              padding:11px 18px; font-size:14.5px; }
      #call:active:not(:disabled) { box-shadow:0 0 0 #177049; }
      #leave { background:transparent; color:#e8503a; border:2px solid #e8503a; border-radius:999px;
               box-shadow:none; padding:9px 15px; font-size:13px; }
      #leave:disabled { border-color:var(--room-line); color:var(--room-dim); }

      /* ══ THE BOARD ════════════════════════════════════════════════════════════
         A lit white panel in a room. Nothing about the teacher is in here, and nothing about
         the maths is over there. */
      .stage { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0;
               padding:12px 14px 14px 12px; }
      .chrome { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 3px 11px;
                flex-wrap:wrap; row-gap:7px; }
      /* Two-state controls are buttons showing the current state, not segmented pairs. Two pairs
         plus a level name as long as "Geometry · Bézier · de Casteljau" overran the row and the
         last control was clipped behind the rail. */
      .tgl { background:var(--room-chip); color:var(--room-chip-ink); border-radius:999px;
             padding:7px 12px; font-size:11.5px; font-weight:650; box-shadow:none;
             white-space:nowrap; flex:0 0 auto; }
      .tgl:hover { color:var(--room-ink); }
      /* The board is a sheet of paper on a lit desk, sized to what is written on it and centred in
         the room. Stretching it to the full height instead gave a tall white field with the lesson
         floating in the middle of it, which is the same emptiness the old layout had — just white
         instead of grey. */
      .desk { flex:1 1 auto; min-height:0; display:flex; align-items:center; }
      .chip { background:var(--room-chip); color:var(--room-chip-ink); border-radius:999px;
              padding:6px 12px; font-size:12.5px; font-weight:650; white-space:nowrap; }
      .chip.hot { background:var(--gold); color:#4a3000; }
      .bar { height:10px; background:var(--room-line); border-radius:999px; overflow:hidden;
             flex:1 1 auto; min-width:50px; }
      .bar i { display:block; height:100%; width:0; border-radius:999px;
               background:linear-gradient(90deg,var(--gold),#ffd36b); transition:width .5s var(--pop); }
      /* The level button is the course picker: a chip that says where you are, and opens the whole
         curriculum over the board rather than above it. */
      .lvbtn { display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:7px 14px;
               font-size:12.5px; font-weight:700; background:#fff; color:var(--ink); box-shadow:none;
               flex:0 0 auto; white-space:nowrap; }
      .lvbtn i { font-style:normal; opacity:.5; font-size:9px; }
      .lvbtn.open { background:var(--gold); color:#4a3000; }
      .pop { position:absolute; z-index:8; top:44px; left:14px; right:14px; background:#fff;
             color:var(--ink); border-radius:16px; padding:12px 13px 4px; display:none;
             overflow:auto; max-height:min(64vh,430px); box-shadow:0 24px 60px -14px rgba(0,0,0,.6); }
      .pop.on { display:block; }

      .whiteboard { width:100%; max-height:100%; background:var(--card); color:var(--ink);
                    border-radius:20px; padding:18px 22px 20px; display:flex; flex-direction:column;
                    box-shadow:var(--board-shadow); }
      .q { font-size:clamp(26px,3.2vw,44px); font-weight:800; text-align:center; flex:0 0 auto;
           font-variant-numeric:tabular-nums; margin:0 0 6px; line-height:1.2; }
      /* "3 ＋ 4 ＝ ▁" and "Match the grey wave — 88% or better" do not want the same type size.
         Set from the rendered length, because only the level knows how long its prompt is. */
      .q.long  { font-size:clamp(20px,2.2vw,30px); }
      .q.xlong { font-size:clamp(17px,1.7vw,23px); }
      .q .blank { display:inline-block; min-width:56px; border-bottom:6px solid var(--gold); border-radius:3px; }

      /* ══ THE WORKSPACE ═══════════════════════════════════════════════════════
         One host element, and it is now the biggest thing on the page. Every manipulative builds
         its own SVG inside it and tears it down again — nothing here knows what a Pythagoras
         square or a Bézier curve is, which is the entire point of the registry.

         Every manipulative draws into a viewBox and the plot is stretched to the host, so the
         picture grows with the window instead of sitting at 484 pixels in the middle of it. That
         is also why the pointer helpers below go through getScreenCTM: the plot letterboxes, and
         a ratio of widths is wrong the moment it does. */
      /* `#work` takes the plugin's viewBox as an aspect-ratio, and the question, the picture, the
         keypad and the hint are centred in the card as one group. Stretching the picture box to
         the full height instead just letterboxed a wide manipulative inside a tall box and left
         a hundred and seventy pixels of nothing above and below it. `flex:0 1 auto` — no grow,
         but it may shrink — is what lets a near-square manipulative still fit. */
      .play { flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
              justify-content:center; gap:8px; }
      /* A maximum as well as a minimum. Handing a manipulative the whole canvas made its parts
         comically large — a manipulative has a size it is legible at, and past about half again
         its own viewBox it stops reading as a diagram and starts reading as decoration.
         `mountFor` sets the ceiling from the plugin's own declared width. */
      #work { flex:0 1 auto; width:100%; min-height:120px; margin:0 auto; position:relative; }
      svg.plot { position:absolute; inset:0; width:100%; height:100%; overflow:visible;
                 touch-action:none; }
      svg.plot text { font:800 14px ui-rounded,system-ui,sans-serif; user-select:none; }
      svg.plot .hit { cursor:pointer; }

      /* Anything the learner can take hold of. `held` is set for the duration of a drag, so a
         manipulative never has to think about the cursor. */
      svg.plot .grab { cursor:grab; }
      svg.plot .grab.held { cursor:grabbing; }
      svg.plot .knob { transition:transform .3s var(--pop); }
      svg.plot .knob.held { transition:none; }
      svg.plot .tri { transition:transform .8s var(--settle); }
      svg.plot .tri.held { transition:none; }
      body.calm svg.plot .knob, body.calm svg.plot .tri { transition:none; }

      /* Eleven across when there is room for eleven, fewer when there is not. A fixed
         `repeat(11,1fr)` ran 0-20 straight off the side of the sheet as soon as the board got
         narrow, and a keypad you cannot reach the 20 on is worse than a keypad in four rows. */
      .pad { display:grid; grid-template-columns:repeat(auto-fit,minmax(32px,1fr)); gap:5px;
             flex:0 0 auto; }
      .pad button { padding:9px 0; font-size:15px; font-weight:800; background:#f3f4f9; color:var(--ink);
                    box-shadow:0 4px 0 var(--line); border-radius:11px; }
      .pad button:active { background:var(--gold); box-shadow:0 0 0 var(--line); }

      /* ══ COURSE PICKER ══════════════════════════════════════════════════════ */
      .strand { margin-bottom:10px; }
      .strand h4 { margin:0 0 5px; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
                   color:var(--dim); font-weight:700; }
      .lvls { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:7px; }
      .lvl { background:#f8f9fc; border-radius:13px; padding:8px 10px; cursor:pointer; text-align:left;
             box-shadow:0 3px 0 var(--line); transition:transform .15s var(--pop), box-shadow .15s;
             border:2px solid transparent; }
      .lvl:hover:not(.soon) { transform:translateY(-2px); box-shadow:0 6px 0 var(--line); }
      .lvl.on { border-color:var(--gold); box-shadow:0 3px 0 #d68f0d; }
      .lvl.soon { opacity:.45; cursor:not-allowed; }
      .lvl .nm { font-weight:750; font-size:13px; }
      .lvl .mt { color:var(--dim); font-size:10.5px; margin-top:2px; display:flex; gap:6px; flex-wrap:wrap;
                 align-items:center; }
      .lvl .d { display:inline-block; width:34px; height:5px; border-radius:99px; background:var(--line);
                position:relative; overflow:hidden; vertical-align:middle; }
      .lvl .d i { position:absolute; inset:0 auto 0 0; background:var(--gold); }
      .lvl .tag { background:var(--grass); color:#fff; border-radius:99px; padding:1px 6px;
                  font-weight:750; font-size:9.5px; letter-spacing:.04em; }

      .mic { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--room-dim); }
      /* Out of the drawer and back on the panel. A microphone that enumerates, hands back a live
         track and then publishes silence is the failure this demo has always been most exposed to
         — and folding the meter away meant the one instrument that shows it was behind a click. */
      .micbar { background:var(--room-chip); border-radius:11px; padding:6px 10px 6px 6px; }
      /* It holds one word when things are fine and a device name plus a verdict when they are
         not, so it is allowed to wrap and the level bar gives up the room. */
      .micbar #micstate { margin-left:auto; font-weight:650; text-align:right; max-width:58%; }
      /* #micmsg holds a live level while it is working and, when it is not, the browser's own
         sentence plus the one naming the fix — which is two lines, not a word on a row. */
      #micmsg { display:block; line-height:1.45; }
      .micbar.bad { background:#3a1f1c; }
      body.lite .micbar.bad { background:#fbe6e2; }
      .mic .lv { flex:1 1 auto; height:6px; background:var(--room-line); border-radius:999px;
                 overflow:hidden; min-width:30px; }
      .mic .lv i { display:block; height:100%; width:0; background:var(--grass); border-radius:999px;
                   transition:width .06s linear; }
      .mic.bad { color:#e8503a; font-weight:650; }
      .mic select { font:inherit; font-size:10.5px; max-width:104px; border-radius:8px; border:0;
                    padding:4px 5px; background:var(--room-chip); color:var(--room-chip-ink); }
      .mic button { padding:4px 8px; font-size:10.5px; border-radius:8px; background:var(--room-chip);
                    color:var(--room-chip-ink); box-shadow:none; font-weight:650; }
      /* The hint under the board is on paper; everything else that uses .hint is in the room. */
      .hint { color:var(--dim); font-size:11.5px; line-height:1.5; margin:0; flex:0 0 auto; }
      .foot .hint { color:var(--room-dim); font-size:10.5px; }
      .err { color:#ff9d8a; font-size:12.5px; font-weight:650; flex:0 0 auto; padding:0 3px 8px; }
      body.lite .err { color:#c3341c; }
      .err:empty { display:none; }

      /* ══ TYPING TO HER ═══════════════════════════════════════════════════════
         The third way in, under the board rather than on it, because it is not a maths widget —
         it is the microphone's understudy. Speech recognition is the one thing in this demo still
         unproven end to end, and three of the four levels hide the keypad, so without this a
         learner whose microphone is broken has no way to say a number at all. */
      .tell { flex:0 0 auto; display:flex; gap:7px; align-items:center; padding:12px 3px 0; }
      .tell input { flex:1 1 auto; min-width:0; font:inherit; font-size:13px; border:0;
                    border-radius:999px; padding:11px 16px; background:var(--room-chip);
                    color:var(--room-ink); }
      .tell input::placeholder { color:var(--room-dim); }
      .tell input:focus { outline:2px solid var(--gold); outline-offset:1px; }
      .tell button { background:var(--gold); color:#4a3000; border-radius:999px; padding:11px 18px;
                     font-size:13px; box-shadow:0 3px 0 #d68f0d; }
      .tell button:active:not(:disabled) { box-shadow:0 0 0 #d68f0d; }
      .tellnote { flex:0 0 auto; font-size:10.5px; color:var(--room-dim); padding:6px 17px 0;
                  min-height:16px; }
      .tellnote b { color:var(--gold); font-weight:650; }

      /* Below this the two halves stop making sense side by side, so the page becomes a document
         again: her panel gets a fixed height at the top, the board follows it, and #main scrolls
         rather than dividing one short viewport between a face and a manipulative and ruining
         both. */
      @media (max-width:880px) {
        #main, #cam { display:block; overflow:auto; }
        #cam { padding:0; }
        /* Full bleed rather than a shell: at this width the rounded frame is all margin. */
        .wrap { display:block; min-height:100vh; border-radius:0; box-shadow:none;
                max-height:none; margin:0; }
        .person { height:auto; }
        .face { aspect-ratio:auto; height:44vh; max-height:none; flex:0 0 auto; }
        .stage { min-height:74vh; padding:12px 12px 16px; }
      }

      /* ══ TRACE RAIL ══════════════════════════════════════════════════════════ */
      /* Capped against the viewport, not just against 70% of it: a rail dragged out to 420px on a
         big screen and then reopened on a small one left the workspace 350 pixels wide. */
      #trace { flex:0 0 var(--rail); min-width:250px; max-width:46vw; height:100vh; background:#14161b;
               color:#c9cedb; display:flex; flex-direction:column; z-index:20;
               font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
      #trace .top { display:flex; align-items:center; gap:5px; padding:8px 9px;
                    border-bottom:1px solid #23262f; flex-wrap:wrap; }
      #trace .top b { color:#eef1f7; font:600 12px/1 ui-sans-serif,system-ui; letter-spacing:.06em; }

    <script>
      /* ══ A DEAD PAGE HAS TO SAY SO ═══════════════════════════════════════════
         Everything below is one `<script type="module">`. A module that throws while it is
         evaluating — a failed import, a syntax error, a null on line one — stops at that point
         and takes every handler after it with it. What is left on screen is the markup: a page
         that looks finished, with a green button that does nothing and a caption still inviting
         you to press it. There is no way to tell that from a slow network, so it gets reported
         as "the page is stuck" and the console is the only place the reason exists.

         This runs in a CLASSIC script, before the module, so it is already listening when the
         module fails. It writes the reason where someone is already looking. */
      (() => {
        const show = (what, detail) => {
          const says = document.getElementById("says"), err = document.getElementById("err");
          if (err) err.textContent = `${what}: ${detail}`;
          if (says) says.textContent = "This page did not finish loading — see the red line below.";
          document.getElementById("call")?.setAttribute("disabled", "");
        };
        addEventListener("error", (e) => {
          // A failed <script>/<img>/<link> fires error on the element and carries no message.
          if (e.target && e.target !== window) {
            return void show("failed to load", e.target.src || e.target.href || String(e.target.tagName));
          }
          show("script error", e.message || String(e.error));
        }, true);
        addEventListener("unhandledrejection", (e) =>
          show("unhandled rejection", String(e.reason?.message ?? e.reason)));
      })();
    </script>
    <script type="module">
      import { Room, RoomEvent, createLocalAudioTrack, createAudioAnalyser }
        from "https://esm.sh/livekit-client@2.19.2";
      import { attachAvatarTools, TOOL_DEADLINE_MS } from "/sdk/tools.js";
      import { enableMicrophone } from "/sdk/browser/index.js";
      const $ = (id) => document.getElementById(id);

      /* ══ SPLIT PANE ══════════════════════════════════════════════════════════ */
      (() => {
        const saved = Number(localStorage.getItem("ms_rail"));
        if (saved >= 250) document.documentElement.style.setProperty("--rail", saved + "px");
        const rz = $("resizer");
        let dragging = false;
        const apply = (x) => {
          const w = Math.max(250, Math.min(window.innerWidth * 0.46, window.innerWidth - x));
          document.documentElement.style.setProperty("--rail", w + "px");
          return w;
        };
        rz.addEventListener("pointerdown", (e) => { dragging = true; rz.classList.add("drag");
          rz.setPointerCapture(e.pointerId); document.body.style.userSelect = "none"; });
        rz.addEventListener("pointermove", (e) => { if (dragging) apply(e.clientX); });
        const stop = (e) => { if (!dragging) return; dragging = false; rz.classList.remove("drag");
          document.body.style.userSelect = ""; localStorage.setItem("ms_rail", String(apply(e.clientX))); };
        rz.addEventListener("pointerup", stop); rz.addEventListener("pointercancel", stop);
        rz.addEventListener("dblclick", () => {
          document.documentElement.style.setProperty("--rail", "460px");
          localStorage.setItem("ms_rail", "460"); });
      })();

      /* ══ TRACE ═══════════════════════════════════════════════════════════════ */
      const Trace = (() => {
        const T0 = performance.now();
        const all = [];
        let filter = "ALL", q = "";
        const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
        const brief = (v, n = 140) => {
          if (v === undefined || v === "") return "";
          let s = typeof v === "string" ? v : JSON.stringify(v);
          if (s === undefined) s = String(v);
          return s.length > n ? s.slice(0, n) + "…" : s;
        };
        function render() {
          const box = $("rows");
          const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
          box.innerHTML = all
            .filter((r) => filter === "ALL" || r.k === filter)
            .filter((r) => !q || (r.name + " " + r.arg + " " + r.res).toLowerCase().includes(q))
            .map((r) => `<div class="row${r.k === "ERR" ? " err" : ""}">
              <span class="ts">+${r.t}s</span><span class="k ${r.k}">${r.k}</span>
              <span class="body"><span class="nm">${esc(r.name)}</span>${
                r.arg ? ` <span class="arg">${esc(r.arg)}</span>` : ""}${
                r.res ? ` <span class="arrow">→</span> <span class="res">${esc(r.res)}</span>` : ""}${
                r.ms != null ? ` <span class="ms">${r.ms}ms</span>` : ""}</span></div>`).join("");
          if (stick) box.scrollTop = box.scrollHeight;
        }
        function add(k, name, arg, res, ms) {
          all.push({ k, name, t: ((performance.now()-T0)/1000).toFixed(2), arg: brief(arg), res: brief(res), ms });
          if (all.length > 800) all.shift();
          render();
        }
        $("tq").oninput = (e) => { q = e.target.value.toLowerCase(); render(); };
        document.querySelectorAll("#trace .tb[data-f]").forEach((b) => b.onclick = () => {
          filter = b.dataset.f;
          document.querySelectorAll("#trace .tb[data-f]").forEach((x) => x.classList.toggle("on", x === b));
          render(); });
        $("tclear").onclick = () => { all.length = 0; render(); };
        $("tcopy").onclick = async () => {
          const txt = all.map((r) => `+${r.t}s  ${r.k.padEnd(4)} ${r.name} ${r.arg}` +
            (r.res ? ` -> ${r.res}` : "") + (r.ms != null ? `  ${r.ms}ms` : "")).join("\n");
          try { await navigator.clipboard.writeText(txt);
            $("tcopy").textContent = "copied"; setTimeout(() => ($("tcopy").textContent = "copy"), 1200);
          } catch { console.log(txt); }
        };
        return {
          http:(n,a,r,ms) => add("HTTP",n,a,r,ms), room:(n,a,r,ms) => add("ROOM",n,a,r,ms),
          tool:(n,a,r,ms) => add("TOOL",n,a,r,ms), say:(s,who="her") => add("SAY",who,"",s),
          work:(n,a,r) => add("WORK",n,a,r),
          mic:(n,a,r) => add("MIC",n,a,r), fx:(n,a) => add("FX",n,a), err:(n,a) => add("ERR",n,a),
        };
      })();

      /* ══ JUICE / SOUND ═══════════════════════════════════════════════════════ */
      const Juice = (() => {
        let trauma = 0, tt = 0, calm = false;
        const cam = $("cam");
        (function loop() {
          if (trauma > 0 && !calm) {
            trauma = Math.max(0, trauma - .03);
            const s = trauma*trauma; tt += .9;
            cam.style.transform = `translate(${12*s*Math.sin(tt*1.7)}px, ${9*s*Math.sin(tt*2.3)}px)`;
            if (trauma === 0) cam.style.transform = "";
          }
          requestAnimationFrame(loop);
        })();
        return {
          setCalm:(v) => { calm = v; document.body.classList.toggle("calm", v); if (v) cam.style.transform = ""; },
          shake:(a) => { trauma = Math.min(1, trauma+a); },
          pop(el, sx = 1.3, sy = .75) { if (!el || calm) return;
            el.style.transition = "none"; el.style.transform = `scale(${sx},${sy})`;
            requestAnimationFrame(() => { el.style.transition = "transform .26s var(--pop)"; el.style.transform = "scale(1)"; }); },
          confetti(n) { if (calm) return;
            const cols = ["#ffb224","#ef5b3f","#3b7ce0","#28a86b","#a469d6"];
            for (let i = 0; i < n; i++) { const c = document.createElement("i");
              c.className = "conf"; c.style.background = cols[i%cols.length];
              c.style.left = Math.random()*100+"vw";
              c.style.animation = `fall ${1+Math.random()*.9}s ${Math.random()*.4}s ease-in forwards`;
              $("fx").appendChild(c); setTimeout(() => c.remove(), 2500); } },
        };
      })();
      /* Synthesised, not shipped. Six mp3s would be six binaries in a folder where the whole
         example is four text files, and sounds this simple are twenty lines of oscillator. */
      const Sfx = (() => {
        let ctx = null;
        const tone = (freq, dur, type, gain, at = 0) => {
          const t0 = ctx.currentTime + at;
          const osc = ctx.createOscillator(), amp = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          amp.gain.setValueAtTime(0.0001, t0);
          amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
          amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(amp).connect(ctx.destination);
          osc.start(t0); osc.stop(t0 + dur + 0.02);
        };
        const VOICES = {
          tap:      () => tone(660, .05, "sine", .05),
          pop:      () => tone(880, .07, "triangle", .06),
          correct:  () => { tone(660, .10, "sine", .09); tone(990, .16, "sine", .07, .07); },
          wrong:    () => { tone(220, .16, "sawtooth", .05); tone(165, .20, "sawtooth", .04, .08); },
          levelup:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, "triangle", .07, i*.07)),
          complete: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .20, "sine", .08, i*.09)),
        };
        return { play(k) {
          const v = VOICES[k]; if (!v) return;
          // Built on the first sound rather than at load: a context created before a gesture
          // starts suspended, and a suspended context swallows everything silently.
          ctx ??= new (window.AudioContext ?? window.webkitAudioContext)();
          if (ctx.state === "suspended") ctx.resume();
          try { v(); } catch {}
        } };
      })();

      /* ══════════════════════════════════════════════════════════════════════════
         THE MANIPULATIVE REGISTRY

         This is the extension point, and it is the only one. A manipulative implements five
         methods, is handed a bare host element, and builds and tears down its own DOM inside it.
         Adding one costs no tool slot, no character of her brief and no change to the six verbs
         below — the curriculum names it by id and the dispatcher looks it up.

           mount(host, task)   draw the starting state
           demonstrate(task)   show the method. MUST return immediately: the worker aborts a tool
                               at TOOL_DEADLINE_MS and the animation does not need her to wait
           read()              what the learner has done, or null if this one takes no input
           events()            drain anything that happened since the last call — see the
                               piggyback note on the dispatcher
           unmount()           put the host back the way you found it
      ══════════════════════════════════════════════════════════════════════════ */
      const SVGNS = "http://www.w3.org/2000/svg";
      const svgIn = (parent, tag, attrs = {}, style = {}) => {
        const e = document.createElementNS(SVGNS, tag);
        for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
        Object.assign(e.style, style);
        return parent.appendChild(e);
      };
      const svgTxt = (parent, x, y, s, fill) => {
        const t = svgIn(parent, "text", { x, y, "text-anchor":"middle", "dominant-baseline":"central" }, { fill });
        t.textContent = s; return t;
      };
      /** A manipulative declares the shape of its own canvas as a viewBox, never a pixel size:
       *  the host stretches the plot to whatever room the workspace has, so a ten-frame gets a
       *  wide strip and a Pythagoras square gets a box, and both grow with the window. */
      const DEFAULT_SIZE = { w:520, h:200 };
      const plot = (host, size = DEFAULT_SIZE) =>
        svgIn(host, "svg", { viewBox:`0 0 ${size.w} ${size.h}`, class:"plot" });

      /** Pointer position in the plot's own units.
       *
       *  Via getScreenCTM rather than getBoundingClientRect and a ratio of widths: the plot
       *  preserves its aspect ratio inside the workspace, so it letterboxes, and the ratio is
       *  wrong by exactly the size of the letterbox the moment the window is not the right
       *  shape. Every drag below goes through here. */
      const svgPt = (svg, e) => {
        const m = svg.getScreenCTM();
        if (!m) return { x:0, y:0 };
        const p = svg.createSVGPoint();
        p.x = e.clientX; p.y = e.clientY;
        const q = p.matrixTransform(m.inverse());
        return { x:q.x, y:q.y };
      };
      /** Direct manipulation, once, for everything below.
       *
       *  Pointer capture rather than window listeners, so a fast drag that leaves the element —
       *  or the plot — keeps going, and so a second finger cannot hijack the first one's handle.
       *  `held` is on the element for the duration, which is where the grabbing cursor and the
       *  suspended CSS transition come from.
       *
       *  Two things here were each a silent, total failure of every drag on the page:
       *
       *  `down` runs BEFORE the capture is taken. A handler that raises its element above its
       *  siblings does it with appendChild, appendChild on a node that already has a parent is a
       *  remove followed by an insert, and removing the capturing element from the document is an
       *  implicit release. Capturing first meant pointerdown arrived, nothing else did, and the
       *  element sat there with the grabbing cursor still on it.
       *
       *  A tap comes back through `up` with `moved: false`, never through a click listener.
       *  preventDefault on pointerdown suppresses the compatibility mouse events, and in Chrome
       *  `click` is generated from those — so a bead with a click handler could be dragged and
       *  could not be tapped, which is the one of the two a five-year-old will actually try. Not
       *  calling preventDefault is not the fix: it is what stops a drag becoming a text selection.
       *
       *  `move` waits until the pointer has travelled `slop`, so a tap that wobbles is still a
       *  tap and the caller never has to keep that bookkeeping itself. */
      const drag = (svg, el, { down, move, up, slop = 5 } = {}) => {
        el.classList.add("grab");
        let p0 = { x:0, y:0 }, moved = false;
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          p0 = svgPt(svg, e); moved = false;
          down?.(p0, e);
          el.setPointerCapture(e.pointerId);
          el.classList.add("held");
        });
        el.addEventListener("pointermove", (e) => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          const p = svgPt(svg, e);
          if (!moved && Math.hypot(p.x-p0.x, p.y-p0.y) < slop) return;
          moved = true;
          move?.(p, e);
        });
        const end = (e) => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          el.releasePointerCapture(e.pointerId);
          el.classList.remove("held");
          up?.(svgPt(svg, e), moved);
        };
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        return el;
      };
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const at = (el, x, y) => { el.style.transform = `translate(${x}px, ${y}px)`; };

      const MANIPULATIVES = {
        /* ── Pythagoras, by rearrangement ───────────────────────────────────────
           Two arrangements of the same square of side (a+b), holding the same four triangles.
           One leaves a tilted hole of area c²; the other leaves two square holes of area a² and
           b². Same square, same triangles, so the holes are equal — that is the theorem.

           It used to be a dissection you watched. Watching a dissection is not doing one, and
           "press the button and the shapes slide" is a slide with extra steps, so the four
           triangles are now yours to move. There are seven slots for four triangles and one of
           the seven belongs to both arrangements, which is why the corner triangle never has to
           move — a fact you find out by trying, and never by being told.

           The holes only appear when an arrangement is complete. Mid-shuffle you get a white
           square and four triangles, which is honest: there is no hole to name yet. */
        pythagoras_rearrange: {
          id:"pythagoras_rearrange", ages:[11,13], takesInput:true, size:{ w:380, h:330 },
          hint:"Drag the four triangles into the other arrangement. Same square, same triangles — so the holes are the same size.",
          _svg:null, _host:null, _geo:null, _slots:[], _tris:[], _q:[], _lay:"c", _gen:0,
          _tf(sl) { const { u, O } = this._geo;
            return `translate(${O.x+sl.x*u}px, ${O.y+sl.y*u}px) rotate(${sl.deg}deg)`; },
          /** Where the triangle's centre of area ends up in a slot. Snapping compares centres
           *  rather than corners, because the corner a triangle is pinned by is a different
           *  corner in each of the four rotations and dropping felt arbitrary when it did. */
          _cen(sl) {
            const { u, O, a, b } = this._geo;
            const r = sl.deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
            const lx = b*u/3, ly = a*u/3;
            return { x: O.x + sl.x*u + lx*c - ly*s, y: O.y + sl.y*u + lx*s + ly*c };
          },
          _layoutOf() {
            const lays = this._tris.map((t) => this._slots.find((s) => s.id === t.slot).lay);
            if (lays.every((l) => l === "c" || l === "both")) return "c";
            if (lays.every((l) => l === "ab" || l === "both")) return "ab";
            return "mixed";
          },
          _render(fromUser) {
            const s = this._svg; if (!s) return;
            const lay = this._layoutOf(), was = this._lay;
            this._lay = lay;
            s.querySelector("#pyC").style.opacity = lay === "c" ? ".6" : "0";
            s.querySelector("#pyAB").style.opacity = lay === "ab" ? ".6" : "0";
            if (fromUser && lay !== was && lay !== "mixed") {
              /* `tell` is the flag that says THIS ONE HAS EARNED THE FLOOR — the dispatcher pushes
                 it to her as a turn instead of leaving it in the ambient queue. Finishing an
                 arrangement is the whole point of this manipulative and it happens once; a drag
                 frame happens sixty times a second and carries no `tell`. Written as speech,
                 because she reads it and she is read aloud: no superscripts, no symbols. */
              this._q.push({ t:"arranged", as: lay, tell: lay === "ab"
                ? "they have just rearranged it into the two small squares, so the hole is now "
                  + "a squared plus b squared"
                : "they have just put it back to the one tilted square, so the hole is c squared" });
              Sfx.play("levelup"); Juice.confetti(18);
              Trace.work("learner completed an arrangement", lay,
                lay === "ab" ? "the hole is now a² + b²" : "the hole is the tilted square, c²");
            }
          },
          mount(host, task) {
            this._host = host; host.innerHTML = ""; this._q = []; this._gen++; this._lay = "c";
            const s = this._svg = plot(host, this.size);
            const { a, b } = task, side = a+b;
            const SQ = 258, O = { x:61, y:24 }, u = SQ/side;
            this._geo = { a, b, side, u, O, SQ };
            const P = (x,y) => `${O.x+x*u},${O.y+y*u}`;

            svgIn(s, "rect", { x:O.x, y:O.y, width:SQ, height:SQ, rx:4 },
              { fill:"#fff", stroke:"var(--ink)", strokeWidth:"2.5" });

            /* Both sets of holes are drawn once, under the triangles, and only their opacity
               moves. Grouping each set with its label means one number to change, not three. */
            const holes = (id, opacity) => svgIn(s, "g", { id }, { opacity, transition:"opacity .45s" });
            const gC = holes("pyC", ".6"), gAB = holes("pyAB", "0");
            svgIn(gC, "polygon", { points:[[b,0],[side,b],[a,side],[0,a]].map(([x,y]) => P(x,y)).join(" ") },
              { fill:"var(--gold)" });
            svgTxt(gC, O.x+SQ/2, O.y+SQ/2, "c²", "#8a5c00");
            svgIn(gAB, "rect", { x:O.x, y:O.y, width:b*u, height:b*u }, { fill:"var(--grass)" });
            svgIn(gAB, "rect", { x:O.x+b*u, y:O.y+b*u, width:a*u, height:a*u }, { fill:"var(--red)" });
            svgTxt(gAB, O.x+b*u/2, O.y+b*u/2, `${b}²`, "#fff");
            svgTxt(gAB, O.x+b*u+a*u/2, O.y+b*u+a*u/2, `${a}²`, "#fff");

            /* Seven slots, four triangles, and `both` is the corner that the two arrangements
               share. It is the reason nothing here ever needs to rotate under its own power. */
            this._slots = [
              { id:"c1",  lay:"c",    x:0,    y:0,    deg:0   },
              { id:"sh",  lay:"both", x:side, y:0,    deg:90  },
              { id:"c3",  lay:"c",    x:side, y:side, deg:180 },
              { id:"c4",  lay:"c",    x:0,    y:side, deg:270 },
              { id:"ab1", lay:"ab",   x:0,    y:b,    deg:0   },
              { id:"ab3", lay:"ab",   x:b,    y:side, deg:180 },
              { id:"ab4", lay:"ab",   x:b,    y:b,    deg:270 },
            ];
            const tri = `0,0 ${b*u},0 0,${a*u}`;
            this._tris = ["c1","sh","c3","c4"].map((slot, i) => {
              const el = svgIn(s, "polygon", { points:tri },
                { fill:"var(--blue)", opacity:".85", stroke:"#fff", strokeWidth:"2" });
              el.classList.add("tri");
              const t = { i, el, slot };
              el.style.transform = this._tf(this._slots.find((x) => x.id === slot));
              drag(s, el, {
                /* `_gen++` here is what the other three manipulatives do in their own drag
                   handlers, and this one was missing it. `demonstrate` shows the other
                   arrangement and puts it back 2.6 seconds later on a timeout — so a learner who
                   took hold of a triangle inside that window had their move quietly reverted by
                   an animation that had already finished on screen. Taking hold of it cancels
                   the hand-back, exactly as it does for the Bézier handles. */
                down: (p) => { this._gen++;
                  t.p0 = p; t.base = this._tf(this._slots.find((x) => x.id === t.slot));
                  s.appendChild(el); },
                move: (p) => { el.style.transform =
                  `translate(${p.x-t.p0.x}px, ${p.y-t.p0.y}px) ` + t.base; },
                up: (p, moved) => {
                  if (!moved) return;                    // a tap leaves it where it is
                  const from = this._slots.find((x) => x.id === t.slot);
                  const c = this._cen(from), want = { x:c.x + p.x-t.p0.x, y:c.y + p.y-t.p0.y };
                  const taken = new Set(this._tris.filter((o) => o !== t).map((o) => o.slot));
                  const free = this._slots.filter((sl) => !taken.has(sl.id));
                  const best = free.reduce((m, sl) => {
                    const d = Math.hypot(this._cen(sl).x-want.x, this._cen(sl).y-want.y);
                    return d < m.d ? { d, sl } : m; }, { d:Infinity, sl:from });
                  t.slot = best.sl.id;
                  el.style.transform = this._tf(best.sl);
                  Sfx.play("pop");
                  this._q.push({ t:"triangle", to: t.slot });
                  this._render(true);
                },
              });
              return t;
            });
            svgTxt(s, O.x+SQ/2, O.y+SQ+30, `${a}² ＋ ${b}² ＝ c²`, "var(--dim)");
            Sfx.play("pop");
            return { legs:[a,b], showing:"the tilted square of area c²", takes_input: true,
                     note:"they drag the four triangles between the two arrangements themselves" };
          },
          demonstrate(task) {
            if (!this._svg) return { error:"nothing mounted" };
            const { a, b } = task, gen = ++this._gen;
            const home = this._tris.map((t) => t.slot);
            const to = this._layoutOf() === "c" ? ["ab1","sh","ab3","ab4"] : ["c1","sh","c3","c4"];
            const put = (ids) => {
              if (this._gen !== gen || !this._svg) return;
              this._tris.forEach((t, i) => { t.slot = ids[i];
                t.el.style.transform = this._tf(this._slots.find((x) => x.id === ids[i])); });
              this._render(false); Sfx.play("pop");
            };
            put(to);
            setTimeout(() => put(home), 2600);        // shown, then handed back to the learner
            return { explain: to[0] === "ab1"
              ? `the same four triangles, moved: the hole is now ${a} squared plus ${b} squared, `
                + `which is ${a*a} plus ${b*b}, so ${a*a+b*b} — and that was c squared all along`
              : `back to one tilted square, and its area is c squared` };
          },
          read() { return { arrangement: this._lay }; },
          events() { const q = this._q; this._q = []; return q; },
          unmount() { this._gen++; if (this._host) this._host.innerHTML = "";
            this._svg = null; this._tris = []; this._q = []; },
        },

        /* ── circle to sine ─────────────────────────────────────────────────────
           The unit circle on the left, the wave it draws on the right, and a line joining the
           two so the height is visibly the same number in both places. */
        circle_sine: {
          id:"circle_sine", ages:[13,15], takesInput:true, size:{ w:520, h:230 },
          hint:"Drag the radius round the circle — the workspace is the answer.",
          _svg:null, _host:null, _q:[], _th:0, _drag:false, _touched:false,
          _C:{ x:88, y:112, r:70 }, _W:{ x0:180, x1:500, amp:70, y:112 },
          _wx(th) { return this._W.x0 + (this._W.x1-this._W.x0) * (th/(Math.PI*2)); },
          mount(host, task) {
            this._host = host; host.innerHTML = ""; this._q = []; this._th = 0;
            this._drag = false; this._touched = false;
            const s = this._svg = plot(host, this.size), C = this._C, W = this._W;
            svgIn(s, "line", { x1:W.x0, y1:W.y, x2:W.x1, y2:W.y },
              { stroke:"#c9cedb", strokeWidth:"2" });
            svgIn(s, "circle", { cx:C.x, cy:C.y, r:C.r },
              { fill:"#fff", stroke:"var(--ink)", strokeWidth:"2.5" });
            svgIn(s, "line", { x1:C.x-C.r-8, y1:C.y, x2:C.x+C.r+8, y2:C.y },
              { stroke:"#c9cedb", strokeWidth:"2" });
            for (const [th,lab] of [[0,"0"],[Math.PI/2,"90"],[Math.PI,"180"],[Math.PI*1.5,"270"]])
              svgTxt(s, this._wx(th), W.y+W.amp+26, lab, "var(--dim)");
            svgIn(s, "path", { id:"csWave" },
              { fill:"none", stroke:"var(--gold)", strokeWidth:"3", strokeLinecap:"round" });
            svgIn(s, "line", { id:"csLink" },
              { stroke:"var(--grass)", strokeWidth:"2", strokeDasharray:"4 4" });
            svgIn(s, "line", { id:"csRad", x1:C.x, y1:C.y },
              { stroke:"var(--red)", strokeWidth:"3", strokeLinecap:"round" });
            svgIn(s, "circle", { id:"csDot", r:9 }, { fill:"var(--red)" });
            svgIn(s, "circle", { id:"csTip", r:7 }, { fill:"var(--grass)" });
            svgTxt(s, C.x, C.y+C.r+30, "", "var(--ink)").setAttribute("id","csVal");

            // The whole plot is the drag surface — the angle is whatever direction you point in.
            const hit = svgIn(s, "rect", { x:0, y:0, width:this.size.w, height:this.size.h,
              fill:"transparent" });
            drag(s, hit, {
              down:(p) => { this._drag = true; this._aim(p); },
              move:(p) => this._aim(p),
              up:() => { this._drag = false; },
            });
            this._set(0, false);
            Sfx.play("pop");
            return { angle_deg:0, takes_input:true, note:"they drag the radius round the circle" };
          },
          _aim(p) {
            let th = Math.atan2(-(p.y-this._C.y), p.x-this._C.x);
            if (th < 0) th += Math.PI*2;
            this._set(th, true);
          },
          _set(th, fromUser) {
            this._th = th;
            const s = this._svg; if (!s) return;
            const C = this._C, W = this._W, sn = Math.sin(th);
            const px = C.x + C.r*Math.cos(th), py = C.y - C.r*sn;
            s.querySelector("#csRad").setAttribute("x2", px);
            s.querySelector("#csRad").setAttribute("y2", py);
            s.querySelector("#csDot").setAttribute("cx", px);
            s.querySelector("#csDot").setAttribute("cy", py);
            const wx = this._wx(th), wy = W.y - W.amp*sn;
            s.querySelector("#csTip").setAttribute("cx", wx);
            s.querySelector("#csTip").setAttribute("cy", wy);
            const link = s.querySelector("#csLink");
            link.setAttribute("x1", px); link.setAttribute("y1", py);
            link.setAttribute("x2", wx); link.setAttribute("y2", wy);
            let d = "";
            for (let t = 0; t <= th+1e-6; t += Math.PI/90)
              d += `${d ? "L" : "M"} ${this._wx(t)} ${W.y - W.amp*Math.sin(t)} `;
            s.querySelector("#csWave").setAttribute("d", d);
            s.querySelector("#csVal").textContent =
              `${Math.round(th*180/Math.PI)}°  ·  sin = ${sn.toFixed(2)}`;
            if (fromUser) { this._touched = true;
              this._q.push({ t:"angle", deg: Math.round(th*180/Math.PI), sin:+sn.toFixed(3) });
              Trace.work("learner set angle", `${Math.round(th*180/Math.PI)}°`, `sin ${sn.toFixed(2)}`); }
          },
          demonstrate(task) {
            const s = this._svg; if (!s) return { error:"nothing mounted" };
            /* Sweeps a full turn and returns at once — the worker aborts a tool at
               TOOL_DEADLINE_MS and this animation runs for well over a second. It also ends
               back at zero, so it never leaves the target angle set for them. */
            const t0 = performance.now(), DUR = 2600;
            const step = () => {
              if (!this._svg || this._drag) return;
              const k = Math.min(1, (performance.now()-t0)/DUR);
              this._set(k*Math.PI*2, false);
              if (k < 1) requestAnimationFrame(step); else this._set(0, false);
            };
            requestAnimationFrame(step);
            return { explain:"as the radius turns, its height is the wave — up to one at ninety "
              + "degrees, back to zero at a hundred and eighty, down to minus one at two seventy" };
          },
          /* Untouched reads as "no answer yet", not as "sin θ is zero". The radius starts at 0°,
             so returning a number here meant her first silent `answer` check burned a wrong
             answer before the learner had moved anything. */
          read() { return this._touched
            ? { value:+Math.sin(this._th).toFixed(3),
                angleDeg: Math.round(this._th*180/Math.PI), sin:+Math.sin(this._th).toFixed(3) }
            : null; },
          events() { const q = this._q; this._q = []; return q; },
          unmount() { if (this._host) this._host.innerHTML = ""; this._svg = null; this._q = [];
            this._touched = false; },
        },

        /* ── Bézier, by de Casteljau ────────────────────────────────────────────
           From Pomax's "A primer on Bézier curves". The construction is the good part: at any t
           you go the same fraction along each leg of the hull, then the same fraction along the
           legs joining *those* points, and again, and the one point you are left with is on the
           curve. Dragging t makes that visible in a way no still picture manages.

           Threading two rings is what turns it from a toy into a task. The rings are generated by
           picking two control points and asking the curve where it is at a third and two thirds,
           so a solution always exists — and `demonstrate` can walk to it exactly rather than
           nearly, because with the ends pinned the two Bernstein rows are just a 2×2 solve. */
        bezier_casteljau: {
          id:"bezier_casteljau", ages:[14,16], takesInput:true, size:{ w:560, h:300 },
          hint:"Drag the two blue handles until the curve threads both rings. Drag t along the bar to watch the point being built.",
          P0:{ x:56, y:236 }, P3:{ x:504, y:236 }, BOX:{ x0:28, y0:26, x1:532, y1:250 },
          _svg:null, _host:null, _p:[], _t:.5, _rings:[], _q:[], _touched:false, _last:-1, _gen:0,
          bez(p1, p2, t) {
            const { P0, P3 } = this, m = 1-t;
            const f = (a,b,c,d) => m*m*m*a + 3*m*m*t*b + 3*m*t*t*c + t*t*t*d;
            return { x:f(P0.x,p1.x,p2.x,P3.x), y:f(P0.y,p1.y,p2.y,P3.y) };
          },
          /** The control points whose curve passes through r1 at t=1/3 and r2 at t=2/3. Times 27
           *  the two Bernstein rows are 12·P1 + 6·P2 and 6·P1 + 12·P2, which inverts by hand. */
          solve(r1, r2) {
            const { P0, P3 } = this;
            const A = { x:27*r1.x - 8*P0.x - P3.x, y:27*r1.y - 8*P0.y - P3.y };
            const B = { x:27*r2.x - P0.x - 8*P3.x, y:27*r2.y - P0.y - 8*P3.y };
            return [{ x:(2*A.x-B.x)/18, y:(2*A.y-B.y)/18 },
                    { x:(2*B.x-A.x)/18, y:(2*B.y-A.y)/18 }];
          },
          _tx(t) { return this.P0.x + (this.P3.x-this.P0.x)*t; },
          _hits() {
            const pts = [];
            for (let i = 0; i <= 200; i++) pts.push(this.bez(this._p[0], this._p[1], i/200));
            return this._rings.map((r) => pts.some((q) => Math.hypot(q.x-r.x, q.y-r.y) <= r.r));
          },
          _render(fromUser) {
            const s = this._svg; if (!s) return;
            const [p1, p2] = this._p, t = this._t;
            let d = "";
            for (let i = 0; i <= 140; i++) { const q = this.bez(p1, p2, i/140);
              d += `${i ? "L" : "M"} ${q.x.toFixed(1)} ${q.y.toFixed(1)} `; }
            s.querySelector("#bzCurve").setAttribute("d", d);
            s.querySelector("#bzHull").setAttribute("points",
              `${this.P0.x},${this.P0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${this.P3.x},${this.P3.y}`);
            at(s.querySelector("#bzH0"), p1.x, p1.y);
            at(s.querySelector("#bzH1"), p2.x, p2.y);
            at(s.querySelector("#bzKnob"), this._tx(t)-this.P0.x, 0);
            s.querySelector("#bzT").textContent = `t = ${t.toFixed(2)}`;

            // de Casteljau itself: lerp the hull, lerp the result, until one point is left.
            const g = s.querySelector("#bzC");
            g.innerHTML = "";
            let level = [this.P0, p1, p2, this.P3];
            while (level.length > 1) {
              const next = level.slice(0, -1).map((q, i) => ({
                x: q.x + (level[i+1].x-q.x)*t, y: q.y + (level[i+1].y-q.y)*t }));
              const last = next.length === 1;
              if (!last) svgIn(g, "polyline", { points: next.map((q) => `${q.x},${q.y}`).join(" ") },
                { fill:"none", stroke:"var(--plum)", strokeWidth:"2", strokeDasharray:"5 4" });
              for (const q of next) svgIn(g, "circle", { cx:q.x, cy:q.y, r: last ? 8 : 5 },
                { fill: last ? "var(--grass)" : "var(--plum)" });
              level = next;
            }
            const hits = this._hits();
            this._rings.forEach((r, i) => {
              const el = s.querySelector("#bzR"+i);
              el.style.stroke = hits[i] ? "var(--grass)" : "#b9c0d0";
              el.style.strokeWidth = hits[i] ? "5" : "3.5";
            });
            if (!fromUser) return;
            this._touched = true;
            const n = hits.filter(Boolean).length;
            if (n === this._last) return;
            this._last = n;
            this._q.push({ t:"threaded", rings:n, of:this._rings.length });
            if (n === this._rings.length) { Sfx.play("correct"); Juice.confetti(16); }
            Trace.work("learner threaded", `${n} of ${this._rings.length} rings`, "");
          },
          mount(host, task) {
            this._host = host; host.innerHTML = ""; this._q = [];
            this._touched = false; this._last = -1; this._t = .5; this._gen++;
            this._rings = task.rings;
            const s = this._svg = plot(host, this.size), { P0, P3, BOX } = this;
            // Starts as a straight line, so the first drag is what bends it.
            this._p = [{ x:P0.x + (P3.x-P0.x)/3, y:P0.y }, { x:P0.x + 2*(P3.x-P0.x)/3, y:P0.y }];

            svgIn(s, "rect", { x:BOX.x0, y:BOX.y0, width:BOX.x1-BOX.x0, height:BOX.y1-BOX.y0, rx:10 },
              { fill:"none", stroke:"var(--line)", strokeWidth:"2" });
            this._rings.forEach((r, i) => svgIn(s, "circle", { id:"bzR"+i, cx:r.x, cy:r.y, r:r.r },
              { fill:"none", stroke:"#b9c0d0", strokeWidth:"3.5", transition:"stroke .2s" }));
            svgIn(s, "polyline", { id:"bzHull" },
              { fill:"none", stroke:"#c9cedb", strokeWidth:"2", strokeDasharray:"6 5" });
            svgIn(s, "path", { id:"bzCurve" },
              { fill:"none", stroke:"var(--gold)", strokeWidth:"4", strokeLinecap:"round" });
            svgIn(s, "g", { id:"bzC" });
            for (const p of [P0, P3]) svgIn(s, "circle", { cx:p.x, cy:p.y, r:7 }, { fill:"var(--ink)" });

            const handle = (id, idx) => {
              const el = svgIn(s, "circle", { id, cx:0, cy:0, r:13 },
                { fill:"var(--blue)", stroke:"#fff", strokeWidth:"3" });
              el.classList.add("knob");
              let off = { x:0, y:0 };
              drag(s, el, {
                down:(p) => { off = { x:p.x-this._p[idx].x, y:p.y-this._p[idx].y }; },
                move:(p) => { this._gen++;   // taking hold of it cancels a demonstrate mid-glide
                              this._p[idx] = { x: clamp(p.x-off.x, BOX.x0, BOX.x1),
                                               y: clamp(p.y-off.y, BOX.y0, BOX.y1) };
                              this._render(true); },
              });
            };
            handle("bzH0", 0); handle("bzH1", 1);

            svgIn(s, "line", { x1:P0.x, y1:278, x2:P3.x, y2:278 },
              { stroke:"var(--line)", strokeWidth:"6", strokeLinecap:"round" });
            const knob = svgIn(s, "circle", { id:"bzKnob", cx:P0.x, cy:278, r:11 },
              { fill:"var(--plum)", stroke:"#fff", strokeWidth:"3" });
            knob.classList.add("knob");
            const bar = svgIn(s, "rect", { x:P0.x-16, y:262, width:P3.x-P0.x+32, height:32 },
              { fill:"transparent" });
            const setT = (p) => { this._gen++;
              this._t = clamp((p.x-P0.x)/(P3.x-P0.x), 0, 1); this._render(true); };
            drag(s, bar, { down:(p) => { knob.classList.add("held"); setT(p); },
                           move:setT, up:() => knob.classList.remove("held") });
            svgTxt(s, 34, 278, "", "var(--dim)").setAttribute("id", "bzT");

            this._render(false);
            Sfx.play("pop");
            return { rings:this._rings.length, threaded:0, takes_input:true,
                     note:"they drag two control handles; how many rings the curve threads is their answer" };
          },
          demonstrate(task) {
            if (!this._svg) return { error:"nothing mounted" };
            const gen = ++this._gen, home = this._p.map((q) => ({ ...q })), t0 = this._t;
            const sol = this.solve(this._rings[0], this._rings[1]);
            const t1 = performance.now();
            const sweep = () => {                    // first, what t actually does
              if (this._gen !== gen || !this._svg) return;
              const k = Math.min(1, (performance.now()-t1)/1800);
              this._t = k; this._render(false);
              if (k < 1) return void requestAnimationFrame(sweep);
              const t2 = performance.now();
              const glide = () => {                  // then, where the handles have to be
                if (this._gen !== gen || !this._svg) return;
                const j = Math.min(1, (performance.now()-t2)/900), e = j*j*(3-2*j);
                this._p = home.map((q, i) => ({ x:q.x + (sol[i].x-q.x)*e,
                                                y:q.y + (sol[i].y-q.y)*e }));
                this._render(false);
                if (j < 1) return void requestAnimationFrame(glide);
                setTimeout(() => {                   // shown, then handed back to the learner
                  if (this._gen !== gen || !this._svg) return;
                  this._p = home.map((q) => ({ ...q })); this._t = t0; this._render(false);
                }, 1600);
              };
              requestAnimationFrame(glide);
            };
            requestAnimationFrame(sweep);
            return { explain:"go the same fraction along each straight leg, then the same fraction "
              + "along the legs joining those points, and again — the point you are left with is "
              + "on the curve. The handles pull the curve; they are not on it" };
          },
          read() { return this._touched
            ? { value: this._hits().filter(Boolean).length, of: this._rings.length } : null; },
          events() { const q = this._q; this._q = []; return q; },
          unmount() { this._gen++; if (this._host) this._host.innerHTML = "";
            this._svg = null; this._q = []; this._touched = false; },
        },

        /* ── Fourier epicycles ──────────────────────────────────────────────────
           Jez Swanson's interactive introduction to Fourier transforms and Jack Schaedler's
           "Seeing circles, sines and signals", which is where the chain of circles drawing a wave
           comes from. A harmonic per circle, an amplitude each, and the epicycle tip and the wave
           are the same height by construction rather than by coincidence: one scale for both.

           A continuous approximation has no crisp right answer, so the check degrades to a
           number: how close the wave is to the target, as a percentage, which is discrete enough
           to mark and honest about what it is measuring.

           THE TASK PICKS THE WAVE, and it used not to. The harmonics, the amplitudes and the pass
           mark were constants on this object, so the level had exactly one question in it — a
           learner who reached it twice built the same square wave twice, and `demonstrate` gave
           away the only answer it had. All four now come off `task`, which is what lets the level
           below hold a bank of waves with different harmonic sets, different rules and different
           slider counts while this file stays a thing that draws a chain of circles. It does not
           know what a square wave is.

           WHERE THE SLIDER RANGE COMES FROM, because it is a way to leak the answer. It used to
           be 1.35/k against a target of 1/k, so every target sat at 74% of its own slider and
           "drag them all three quarters of the way up" solved the level without a thought. It is
           1.2/√k now: still a statement about harmonics rather than about this task's answer, and
           the targets land at different fractions of each slider. */
        fourier_epicycles: {
          id:"fourier_epicycles", ages:[15,16], takesInput:true, size:{ w:560, h:350 },
          hint:"Drag the sliders until your wave sits on the grey one. Each slider is one circle in the chain.",
          S:42, BAND:78,
          _C:{ x:128, y:112 }, _W:{ x0:258, x1:548 },
          _MIX:{ y0:236, y1:310, x0:92, x1:468 },
          _svg:null, _host:null, _t:null, _X:[], _a:[], _q:[], _touched:false, _last:-1,
          _gen:0, _life:0, _th:0,
          /* Defaults are the square wave, for the console driver and for a task that forgets. */
          _harm() { return this._t?.harmonics ?? [1,3,5,7]; },
          _target() { return this._t?.target ?? [1,1/3,1/5,1/7]; },
          _need() { return this._t?.need ?? 88; },
          _vmax(i) { return 1.2/Math.sqrt(this._harm()[i]); },
          /** Slider x positions, spread across the mixer for however many circles there are. */
          _xs() { const n = this._harm().length, { x0, x1 } = this._MIX;
            return Array.from({ length:n }, (_, i) => n < 2 ? (x0+x1)/2 : x0 + (x1-x0)*i/(n-1)); },
          _sum(th, a) { return this._harm().reduce((v, k, i) => v + (a[i] ?? 0)*Math.sin(k*th), 0); },
          _wx(th) { return this._W.x0 + (th/(Math.PI*2))*(this._W.x1-this._W.x0); },
          _wy(v) { return clamp(this._C.y - this.S*v, this._C.y-this.BAND, this._C.y+this.BAND); },
          _path(a) {
            let d = "";
            for (let i = 0; i <= 180; i++) { const th = i/180*Math.PI*2;
              d += `${i ? "L" : "M"} ${this._wx(th).toFixed(1)} ${this._wy(this._sum(th,a)).toFixed(1)} `; }
            return d;
          },
          _fit() {
            const tgt = this._target();
            let e = 0, b = 0;
            for (let i = 0; i < 180; i++) {
              const th = i/180*Math.PI*2, g = this._sum(th, tgt);
              e += (this._sum(th, this._a)-g)**2; b += g*g;
            }
            return Math.max(0, Math.round(100*(1 - Math.sqrt(e/b))));
          },
          _sy(i, v) { const M = this._MIX; return M.y1 - (v/this._vmax(i))*(M.y1-M.y0); },
          _redraw(fromUser) {
            const s = this._svg; if (!s) return;
            s.querySelector("#foMine").setAttribute("d", this._path(this._a));
            this._a.forEach((v, i) => {
              at(s.querySelector("#foK"+i), 0, this._sy(i, v)-this._MIX.y1);
              s.querySelector("#foV"+i).textContent = v.toFixed(2);
            });
            const fit = this._fit(), need = this._need();
            s.querySelector("#foFit").textContent = `fit ${fit}% · need ${need}%`;
            s.querySelector("#foFit").style.fill = fit >= need ? "var(--grass)" : "var(--dim)";
            if (!fromUser) return;
            this._touched = true;
            if (fit === this._last) return;
            const was = this._last; this._last = fit;
            this._q.push({ t:"fit", percent:fit });
            if (fit >= need && was < need) { Sfx.play("correct"); Juice.confetti(18); }
            Trace.work("learner tuned harmonics", this._a.map((v) => v.toFixed(2)).join(" "), `fit ${fit}%`);
          },
          _tick() {
            const s = this._svg; if (!s) return;
            if (!document.body.classList.contains("calm")) this._th = (this._th + .016) % (Math.PI*2);
            let x = this._C.x, y = this._C.y;
            const pts = [`${x},${y}`], harm = this._harm();
            this._a.forEach((v, i) => {
              const k = harm[i], r = this.S*v;
              const c = s.querySelector("#foC"+i);
              c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", Math.max(0, r));
              x += r*Math.cos(k*this._th); y -= r*Math.sin(k*this._th);
              pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
            });
            s.querySelector("#foArm").setAttribute("points", pts.join(" "));
            const tip = s.querySelector("#foTip");
            tip.setAttribute("cx", x); tip.setAttribute("cy", y);
            const wx = this._wx(this._th), wy = this._wy(this._sum(this._th, this._a));
            const mk = s.querySelector("#foMk");
            mk.setAttribute("cx", wx); mk.setAttribute("cy", wy);
            const ln = s.querySelector("#foLink");
            ln.setAttribute("x1", x); ln.setAttribute("y1", y);
            ln.setAttribute("x2", wx); ln.setAttribute("y2", wy);
          },
          mount(host, task) {
            this._host = host; host.innerHTML = "";
            /* The task, held for the whole mount: every method above reads the harmonics, the
               target and the pass mark off it, and none of them is a constant on this object. */
            this._t = task ?? null;
            this._X = this._xs();
            const harm = this._harm(), n = harm.length;
            this._q = []; this._touched = false; this._last = -1; this._th = 0;
            this._a = new Array(n).fill(0);
            const life = ++this._life;
            this._gen++;
            const s = this._svg = plot(host, this.size), C = this._C, W = this._W, M = this._MIX;
            svgIn(s, "line", { x1:W.x0, y1:C.y, x2:W.x1, y2:C.y },
              { stroke:"#e2e5ec", strokeWidth:"2" });
            svgIn(s, "line", { x1:C.x-this.BAND-6, y1:C.y, x2:C.x+this.BAND+6, y2:C.y },
              { stroke:"#e2e5ec", strokeWidth:"2" });
            svgIn(s, "path", { d:this._path(this._target()) },
              { fill:"none", stroke:"#bcc3d2", strokeWidth:"3", strokeDasharray:"7 6" });
            for (let i = 0; i < n; i++) svgIn(s, "circle", { id:"foC"+i, cx:C.x, cy:C.y, r:0 },
              { fill:"none", stroke:"#ccd3e0", strokeWidth:"1.5" });
            svgIn(s, "polyline", { id:"foArm" },
              { fill:"none", stroke:"var(--red)", strokeWidth:"3", strokeLinejoin:"round" });
            svgIn(s, "line", { id:"foLink" },
              { stroke:"var(--grass)", strokeWidth:"1.5", strokeDasharray:"4 4" });
            svgIn(s, "path", { id:"foMine" },
              { fill:"none", stroke:"var(--gold)", strokeWidth:"3.5", strokeLinecap:"round" });
            svgIn(s, "circle", { id:"foTip", r:6 }, { fill:"var(--red)" });
            svgIn(s, "circle", { id:"foMk", r:6 }, { fill:"var(--grass)" });
            /* Anchored to the two ends of the wave rather than centred at two guessed x's. Both
               of these grow — "need 92%" is wider than "need 88%", and the target caption used to
               carry the wave's name — and centred captions that grow collide. The wave is named
               in the question above the board; it does not need saying twice. */
            svgTxt(s, W.x1, 22, "", "var(--dim)").setAttribute("id", "foFit");
            s.querySelector("#foFit").setAttribute("text-anchor", "end");
            svgTxt(s, W.x0, 22, "grey is the target", "#bcc3d2")
              .setAttribute("text-anchor", "start");

            this._X.forEach((x, i) => {
              svgTxt(s, x, 224, harm[i] === 1 ? "sin θ" : `sin ${harm[i]}θ`, "var(--dim)");
              svgIn(s, "line", { x1:x, y1:M.y0, x2:x, y2:M.y1 },
                { stroke:"var(--line)", strokeWidth:"6", strokeLinecap:"round" });
              const k = svgIn(s, "circle", { id:"foK"+i, cx:x, cy:M.y1, r:11 },
                { fill:"var(--gold)", stroke:"#fff", strokeWidth:"3" });
              k.classList.add("knob");
              svgTxt(s, x, 330, "0.00", "var(--dim)").setAttribute("id", "foV"+i);
              const hit = svgIn(s, "rect", { x:x-24, y:M.y0-16, width:48, height:M.y1-M.y0+32 },
                { fill:"transparent" });
              const set = (p) => {
                this._gen++;                         // a drag cancels a demonstrate mid-glide
                this._a[i] = clamp((M.y1-p.y)/(M.y1-M.y0)*this._vmax(i), 0, this._vmax(i));
                this._redraw(true);
              };
              drag(s, hit, { down:(p) => { k.classList.add("held"); set(p); },
                             move:set, up:() => k.classList.remove("held") });
            });

            this._redraw(false);
            /* One loop for the whole chain, keyed on `_life` rather than `_gen`: `_gen` is bumped
               by every drag and by every demonstrate, and the circles have to keep turning
               through both. It stops itself when the plug is torn down or remounted. */
            const spin = () => { if (this._life !== life || !this._svg) return;
              this._tick(); requestAnimationFrame(spin); };
            requestAnimationFrame(spin);
            Sfx.play("pop");
            return { wave: task?.label ?? "wave", harmonics: harm, circles: n,
                     amplitudes: this._a.slice(), fit_percent: this._fit(), need: this._need(),
                     takes_input:true,
                     note:`they drag ${n} amplitudes; the fit percentage is their answer` };
          },
          demonstrate(task) {
            if (!this._svg) return { error:"nothing mounted" };
            const gen = ++this._gen, home = [...this._a], tgt = this._target();
            const t0 = performance.now();
            const glide = () => {
              if (this._gen !== gen || !this._svg) return;
              const k = Math.min(1, (performance.now()-t0)/1100), e = k*k*(3-2*k);
              this._a = home.map((v, i) => v + ((tgt[i] ?? 0)-v)*e);
              this._redraw(false);
              if (k < 1) return void requestAnimationFrame(glide);
              setTimeout(() => {                     // shown, then handed back to the learner
                if (this._gen !== gen || !this._svg) return;
                this._a = [...home]; this._redraw(false);
              }, 1800);
            };
            requestAnimationFrame(glide);
            /* The sentence belongs to the WAVE, not to this file — there are four of them in the
               level's bank and each one is a different rule. */
            return { explain: (task ?? this._t)?.explain
              ?? "each circle is one harmonic, and its slider is how big that circle is" };
          },
          read() { return this._touched ? { value: this._fit() } : null; },
          events() { const q = this._q; this._q = []; return q; },
          unmount() { this._gen++; this._life++; if (this._host) this._host.innerHTML = "";
            this._svg = null; this._q = []; this._touched = false; },
        },
      };

      /* ══════════════════════════════════════════════════════════════════════════
         THE CURRICULUM REGISTRY

         Data, not control flow. A level names a manipulative by id, knows how to generate a task
         and how to mark one, and declares who it is for. Adding a level is pushing an object.

         The entries with a `planned` tag are not implemented — they are the P1-P3 cases from the
         architecture page, left here on purpose. They cost nothing, they prove the schema already
         accommodates a Bézier curve and a Fourier series, and a roadmap you can see in the
         product is worth more than one in a document nobody opens.
      ══════════════════════════════════════════════════════════════════════════ */
      const blank = (v) => v == null ? `<span class="blank"></span>` : `<b id="ans">${v}</b>`;

      /* `check` and `answerFrom` live on the LEVEL rather than in the answer verb: P0 got away
         with hardcoding `given === task.want` because everything was arithmetic, and the first
