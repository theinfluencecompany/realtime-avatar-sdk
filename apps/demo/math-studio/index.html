         trigonometry level broke that immediately — "sin θ is 0.5" is a tolerance, not an
         equality, and the answer does not come from the keypad at all.

         The levels whose answer can only come off the workspace. Not a stylistic choice: the
         answer to "thread both rings" is the number two, and a keypad next to that question is a
         button marked *win*. Where doing the thing is the whole task, her ears and the keypad are
         both shut off and `read()` is the only way in. */
      const onWorkspace = {
        input:"workspace",
        answerFrom: ({ work }) => work?.value ?? null,
      };
      // c stays inside 20, so Pythagoras is the one level left that still wants the keypad.
      const TRIPLES = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20]];

      /**
       * The Fourier level's question bank.
       *
       * One entry is one wave: which circles are in the chain, how big each one has to be, the
       * rule a learner can say out loud once they find it, and the mark that counts as matched.
       * The manipulative reads all of it off the task and knows none of it — which is why adding
       * a fifth wave here costs nothing anywhere else.
       *
       * `need` IS PER WAVE, and it has to be. They do not converge at the same rate: a square
       * wave with three of its four circles set correctly is still only 87% matched, so 88 forces
       * all four; a pulse with three of four is 50%, and 90 is the same demand. Triangle waves
       * are absent for exactly this reason — the fundamental alone already scores 88, so every
       * slider after the first would be decoration.
       */
      const FOURIER_WAVES = [
        { wave:"square", label:"square wave", need:88,
          harmonics:[1,3,5,7], target:[1, 1/3, 1/5, 1/7],
          aliases:["square"],
          explain:"a square wave is the odd circles only, and each one smaller: the whole of the "
            + "first, a third of the third, a fifth of the fifth, a seventh of the seventh" },
        { wave:"sawtooth", label:"sawtooth", need:88,
          harmonics:[1,2,3,4], target:[1, 1/2, 1/3, 1/4],
          aliases:["saw","sawtooth","ramp"],
          explain:"a sawtooth takes every circle, not just the odd ones, and they fall away the "
            + "same way: the whole of the first, a half, a third, a quarter" },
        { wave:"pulse", label:"pulse", need:90,
          harmonics:[1,2,3,4], target:[.45,.45,.45,.45],
          aliases:["pulse","spike","comb","flat"],
          explain:"all four the same size. Equal circles line up into one spike and cancel each "
            + "other everywhere else, which is why this one is a pulse rather than a wave" },
        { wave:"square5", label:"square wave with five circles", need:92,
          harmonics:[1,3,5,7,9], target:[1, 1/3, 1/5, 1/7, 1/9],
          aliases:["five","ninth","longer","sharper"],
          explain:"the same odd rule as the square wave with one more circle on the end, a ninth "
            + "of the ninth — and every circle you add squares the corners a little further" },
      ];

      /* ══ WHAT THEY ASKED FOR ═════════════════════════════════════════════════
         A level that wants to hear a request declares `aliases` and reads the `hint` its `gen`
         is handed. Both are optional and both are data: the resolver below does not know what a
         sawtooth is, and neither does the dispatcher. See `resolveWant`. */
      const pickBy = (list, hint, fallback) => {
        const q = String(hint ?? "").toLowerCase();
        const asked = q && list.find((w) => w.aliases.some((a) => q.includes(a)));
        return asked ? { ...asked, asked:true } : { ...fallback(), asked:false };
      };

      const CURRICULUM = [
        { id:"geo.pythagoras", strand:"geometry", name:"Pythagoras", ages:[11,13], difficulty:5,
          manipulative:"pythagoras_rearrange", input:"keypad20",
          aliases:["pythagoras","hypotenuse","right angle","right-angled","triangle","leg"],
          hints:["bigger","smaller","larger","big numbers","small numbers"],
          /* `hint` is whatever the learner asked for, in their own words, relayed by her. A level
             that can honour it does and reports `asked`; one that cannot ignores the argument and
             nothing breaks. Difficulty words never reach here — those move the level instead. */
          gen(hint) {
            const q = String(hint ?? "").toLowerCase();
            const big = /\b(big|bigger|large|larger)/.test(q);
            const small = /\b(small|smaller|little|tiny)/.test(q);
            const pool = big ? TRIPLES.slice(3) : small ? TRIPLES.slice(0, 2) : TRIPLES;
            const [a,b,c] = pool[Math.floor(Math.random()*pool.length)];
            return { a, b, want:c, asked: big || small }; },
          prompt: (t, v) => `${t.a}² ＋ ${t.b}² ＝ ` + blank(v) + "²",
          say: (t) => `a right angled triangle with legs ${t.a} and ${t.b} — how long is the hypotenuse`,
          check: (t, g) => ({ correct: g === t.want, expected: t.want }),
          // The rearrangement is the argument, not the answer, so this one keeps the keypad.
          answerFrom: ({ heard, tapped, typed }) =>
            typeof heard === "number" ? heard : (typed ?? tapped ?? null) },

        { ...onWorkspace, id:"geo.bezier", strand:"geometry", name:"Bézier · de Casteljau",
          ages:[14,16], difficulty:7, manipulative:"bezier_casteljau",
          aliases:["bezier","bézier","casteljau","curve","spline","ring","handle"],
          hints:["tighter","tight","precise","wider","wide","generous"],
          /* The rings come off a curve that already exists, so every task is solvable and
             `demonstrate` can walk to the real answer. Rejecting the near-together and the
             hugging-the-baseline cases is the difference between a puzzle and a formality. */
          gen(hint) {
            const q = String(hint ?? "").toLowerCase();
            /* The one dial a ring has. Worded so it cannot collide with easier/harder — those
               move the level, and a request that did both would move them twice as far as asked. */
            const tight = /\b(tight|tighter|precise)/.test(q);
            const wide = /\b(wide|wider|generous)/.test(q);
            const r = tight ? 17 : wide ? 33 : 24;
            const M = MANIPULATIVES.bezier_casteljau, B = M.BOX;
            const rnd = () => ({ x: B.x0+70 + Math.random()*(B.x1-B.x0-140),
                                 y: B.y0+16 + Math.random()*(B.y1-B.y0-96) });
            for (let i = 0; i < 60; i++) {
              const c1 = rnd(), c2 = rnd();
              const r1 = M.bez(c1, c2, 1/3), r2 = M.bez(c1, c2, 2/3);
              if (Math.hypot(r1.x-r2.x, r1.y-r2.y) < 120) continue;
              if (Math.min(r1.y, r2.y) > B.y1-70) continue;
              return { rings:[{ ...r1, r }, { ...r2, r }], asked: tight || wide };
            }
            return { rings:[{ x:190, y:96, r }, { x:390, y:170, r }], asked: tight || wide };
          },
          prompt: (t, v) => v == null ? "Thread the curve through both rings"
            : `${blank(v)} of ${t.rings.length} rings threaded`,
          say: (t) => "bend the curve with the two handles until it goes through both rings",
          check: (t, g) => ({ correct: g === t.rings.length, expected: t.rings.length }) },

        { ...onWorkspace, id:"trig.circlesine", strand:"trigonometry", name:"Circle to sine",
          ages:[13,15], difficulty:6, manipulative:"circle_sine",
          aliases:["sine","sin ","circle","radius","angle","degree","trig"],
          hints:["negative","minus","below","positive","above","half"],
          // Never 0: the radius starts at 0°, so a target of zero would already be satisfied.
          gen(hint) {
            const q = String(hint ?? "").toLowerCase();
            const neg = /\b(neg|minus|below|under|bottom)/.test(q);
            const pos = /\b(pos|above|top)/.test(q);
            const half = /\b(half|0 5|point five)/.test(q);
            const T = neg ? [-1, -.5] : pos ? [1, .5] : half ? [.5, -.5] : [1, .5, -1, -.5];
            return { target: T[Math.floor(Math.random()*T.length)],
                     asked: neg || pos || half }; },
          prompt: (t, v) => `sin θ ＝ ${t.target}` + (v == null ? " " + blank(null) : `　·　you made ${blank(v)}`),
          say: (t) => `turn the radius until the height is ${t.target}`,
          // A tolerance, not an equality — and both angles that satisfy it are right.
          check: (t, g) => ({ correct: Math.abs(g - t.target) < .06, expected: t.target }) },

        { ...onWorkspace, id:"sig.fourier", strand:"signals", name:"Fourier series", ages:[15,16],
          difficulty:9, manipulative:"fourier_epicycles",
          aliases:["fourier","harmonic","epicycle","square wave","sawtooth","pulse","signal",
                   "series","wave"],
          /* Every word the wave bank answers to. It is derived rather than written out, so a
             fifth wave teaches the resolver its own name by being added to the table. */
          hints: FOURIER_WAVES.flatMap((w) => w.aliases),
          /* Four waves, and never the one they have just done — a level whose every task was the
             same square wave was a level with one question in it. A learner who asks for the
             sawtooth gets the sawtooth; everyone else gets one they have not just built. */
          gen(hint) {
            return pickBy(FOURIER_WAVES, hint, () => {
              const pool = FOURIER_WAVES.filter((w) => w.wave !== task?.wave);
              return pool[Math.floor(Math.random()*pool.length)];
            }); },
          prompt: (t, v) => v == null ? `Match the grey ${t.label} — ${t.need}% or better`
            : `fit ${blank(v)}%`,
          say: (t) => `build the ${t.label}: set the ${t.harmonics.length} amplitudes until yours `
            + `sits on the grey one`,
          // No crisp right answer exists, so the check degrades to a threshold on the fit.
          check: (t, g) => ({ correct: g >= t.need, expected: t.need }) },

        /* Still declared, still dimmed, still costing nothing. Both are from the same list the
           four new manipulatives came out of, and both are here for the same reason the last two
           were: a roadmap you can see in the product beats one in a document nobody opens. */
        { id:"geo.euclidea", strand:"geometry", name:"Straightedge & compass", ages:[13,16],
          difficulty:8, manipulative:"euclid_construct", planned:"next" },
        { id:"sig.aliasing", strand:"signals", name:"Sampling & aliasing", ages:[15,16],
          difficulty:10, manipulative:"sampling_alias", planned:"next" },
      ];
      const RUNNABLE = CURRICULUM.filter((l) => l.gen);
      const STRAND_NAMES = { geometry:"Geometry", trigonometry:"Trigonometry", signals:"Signals" };

      /* ══ SESSION STATE ═══════════════════════════════════════════════════════ */
      const RUN = 10;
      /* The key carries the defaults' version, because a default only means anything to somebody
         who has never run this. Change what the page opens on and every existing visitor keeps
         the old one forever, having never chosen it — which looks exactly like the change not
         working. Bumping the suffix retires the old state instead of migrating it: this is ten
         practice questions and a percentage, not something worth carrying forward. */
      const SAVE_KEY = "mathstudio.v2";
      const save = JSON.parse(localStorage.getItem(SAVE_KEY)
        || '{"levelId":"sig.fourier","acc":null}');
      const persist = () => localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      localStorage.removeItem("mathstudio");     // v1, superseded
      let level = RUNNABLE.find((l) => l.id === save.levelId) ?? RUNNABLE[0];
      let task = null, active = null;          // active = the mounted manipulative
      let done = 0, right = 0, streak = 0, wrongRun = 0, history = [], t0 = 0;
      /** True only for a task SHE set. The page previews a level the moment you pick one, and a
       *  preview is not a question anybody asked — so the workspace must not interrupt her about
       *  one, or she marks an answer to something she never said out loud. */
      let tutorLed = false;

      /** The one place a task begins. Three things reset with it and forgetting any of them is a
       *  bug you only see on the second question: the workspace's event queue, the latch that
       *  lets the screen take the floor, and what it has already said. */
      function setTask(t, fromTutor = false) {
        task = t; tutorLed = fromTutor; Activity.reset();
      }

      /**
       * WHAT THEY ASKED FOR, resolved against the curriculum rather than against her judgement.
       *
       * She has the conversation and the page has the course, so `next_task` takes a `want` — the
       * learner's own words, relayed, not interpreted. Nothing here parses meaning: a level
       * declares `aliases`, this scores against those and against the strand names, and the two
       * difficulty phrases fall through to the same `shift` the streak logic uses. A phrase that
       * names nothing changes nothing and says so, which is the important half — she must not
       * promise a topic the curriculum does not have.
       *
       * The hint goes on to `gen` whether or not the level moved, because a level can honour a
       * request without being a different level: "can we do a sawtooth" on the Fourier level is
       * the same level and a different wave.
       *
       * WHICH IS WHY `hints` IS CHECKED FIRST. A level lists there whatever its own `gen`
       * understands, and a phrase that matches stays put. Without it "five circles" on the
       * Fourier level moved them to Circle to sine — "circles" is that level's word — and the
       * wave they actually asked for was never reached. What a level can do for itself outranks
       * what another level is named.
       */
      const NORM = (s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ");
      /* "too hard" is a request for something EASIER and it contains the word hard, so the two
         complaints have to be read before the two adjectives or every one of them goes the wrong
         way. Order in DIRS is the whole fix. */
      const TOO_HARD = /\btoo (hard|difficult|fast|tricky|much)\b/;
      const TOO_EASY = /\btoo (easy|simple|slow|basic)\b/;
      const EASIER = /\b(easier|easy|simpler|simple|slower|back|down)\b/;
      const HARDER = /\b(harder|hard|tougher|tough|faster|next|up|advanced)\b/;
      const DIRS = [[TOO_HARD, -1, "easier"], [TOO_EASY, +1, "harder"],
                    [EASIER, -1, "easier"], [HARDER, +1, "harder"]];
      function resolveWant(raw) {
        const q = NORM(raw);
        if (!q.trim()) return { asked:false };
        const hits = (l, key) => (l[key] ?? []).some((a) => q.includes(NORM(a).trim()));
        if (hits(level, "hints")) {
          Trace.work("she relayed a request", raw, `${level.name} can do that itself`);
          return { asked:true, moved:false, own:true };
        }
        const named = RUNNABLE.find((l) => l !== level && hits(l, "aliases"))
          ?? RUNNABLE.find((l) => l !== level && q.includes(l.strand));
        if (named) {
          level = named; save.levelId = level.id; persist();
          Trace.work("she relayed a request", raw, `moved to ${level.name}`);
          return { asked:true, moved:true, to:level.name };
        }
        for (const [re, dir, word] of DIRS) {
          if (!re.test(q)) continue;
          const moved = nudge(dir);
          Trace.work("she relayed a request", raw,
            moved ? `${word} — now ${level.name}` : `${word} — nothing in the course is`);
          return { asked:true, moved, to:level.name, direction:word };
        }
        return { asked:true, moved:false };
      }

      function mountFor(t) {
        const next = MANIPULATIVES[level.manipulative];
        if (active && active !== next) active.unmount();
        active = next ?? null;
        if (!active) return { error:`manipulative "${level.manipulative}" is not implemented yet` };
        /* The one thing the host takes from the plugin is the shape of its canvas, as a ratio.
           A ten-frame wants a wide strip and a Pythagoras square wants a box, and the picture
           then grows with the window instead of sitting at 484 pixels in the middle of it. */
        const size = active.size ?? DEFAULT_SIZE;
        $("work").style.aspectRatio = `${size.w} / ${size.h}`;
        $("work").style.maxWidth = Math.round(size.w * 1.5) + "px";
        const out = active.mount($("work"), t) ?? {};
        Trace.work("mount", level.manipulative, JSON.stringify(out));
        return { manipulative: active.id, ...out };
      }

      const renderQ = (v) => {
        $("q").innerHTML = task ? level.prompt(task, v) : "— — —";
        const n = $("q").textContent.trim().length;
        $("q").classList.toggle("long", n > 18);
        $("q").classList.toggle("xlong", n > 32);
      };

      /** Picking a level shows it immediately, without a call.
       *
       *  Manipulatives used to mount only when she called `show`, so choosing Geometry left an
       *  empty workspace with the 0-20 keypad still under it — and the only thing on screen was
       *  the keypad, which reads as "this is still a calculator". A course picker that does not
       *  show you the course is not a course picker. */
      function preview() {
        setTask({ ...level.gen(), helped:false });
        renderQ(null);
        mountFor(task);
        hud();
      }

      function hud() {
        $("lvchip").innerHTML = `${STRAND_NAMES[level.strand]} · ${level.name} <i>▾</i>`;
        $("cnt").textContent = `${done} / ${RUN}`;
        $("stk").textContent = `streak ${streak}`;
        $("stk").classList.toggle("hot", streak >= 3);
        $("bar").style.width = `${Math.min(100,(done/RUN)*100)}%`;
        /* A keypad is the wrong instrument for "turn the radius until the height is 0.5". The
           sentence under the workspace belongs to the MANIPULATIVE too: it used to be a growing
           if-else in here that had to be edited every time one was added, which is exactly the
           coupling the registry exists to prevent. */
        const plug = MANIPULATIVES[level.manipulative];
        const onWork = level.input === "workspace";
        $("pad").style.display = onWork ? "none" : "grid";
        $("inputhint").textContent = onWork
          ? (plug?.hint ?? "The workspace is the answer.")
          : plug?.hint
            ? plug.hint + "  Or say it, type it, or tap a number."
            : "Say the answer, type it, or tap a number.";
        // On a workspace level a typed number is not an answer, so the box stops offering to be one.
        $("tellin").placeholder = onWork
          ? "Say something to her…"
          : "Type an answer, or say something to her…";
        document.querySelectorAll(".lvl").forEach((el) =>
          el.classList.toggle("on", el.dataset.id === level.id));
      }

      /** Move within the current strand, by difficulty, skipping anything not implemented. */
      function shift(dir) {
        const peers = RUNNABLE.filter((l) => l.strand === level.strand)
          .sort((a,b) => a.difficulty - b.difficulty);
        const i = peers.indexOf(level);
        const next = peers[i+dir];
        if (!next) return false;
        level = next; save.levelId = level.id; persist();
        return true;
      }

      /**
       * The same move, for a learner who asked for it in words rather than earning it on a streak.
       *
       * `shift` stays inside the strand deliberately: levelling up on three right answers should
       * keep you on the topic you are getting good at. Asking out loud is a different request —
       * it is about difficulty and not about topic, and Signals has exactly ONE runnable level,
       * so "this is too hard" on the Fourier series used to leave them exactly where they were.
       * When the strand runs out, the nearest level in the right direction anywhere in the course
       * is a better answer than no answer. It still returns false when there genuinely isn't one.
       */
      function nudge(dir) {
        if (shift(dir)) return true;
        const away = RUNNABLE
          .filter((l) => dir > 0 ? l.difficulty > level.difficulty : l.difficulty < level.difficulty)
          .sort((a, b) => dir > 0 ? a.difficulty - b.difficulty : b.difficulty - a.difficulty);
        if (!away.length) return false;
        level = away[0]; save.levelId = level.id; persist();
        return true;
      }

      function reportCard() {
        const secs = Math.round((performance.now()-t0)/1000);
        const acc = done ? right/done : 0;
        const medal = acc >= .9 ? "🥇" : acc >= .7 ? "🥈" : "🥉";
        const helped = history.filter((h) => h.helped).length;
        save.acc = acc; save.levelId = level.id; persist();
        $("report").innerHTML = `<h3>Run complete</h3><div class="big">${medal} ${"★".repeat(right)}</div>
          <table><tr><td>Correct</td><td>${right} / ${done}</td></tr>
          <tr><td>Time</td><td>${secs}s</td></tr>
          <tr><td>Finished on</td><td>${level.name}</td></tr>
          <tr><td>Times she demonstrated</td><td>${helped}</td></tr></table>
          <button style="margin-top:14px;width:100%" id="closerep">OK</button>`;
        $("sheet").classList.add("on");
        $("closerep").onclick = () => $("sheet").classList.remove("on");
        Sfx.play("complete"); Juice.shake(.6); Juice.confetti(120);
      }

      /* ══════════════════════════════════════════════════════════════════════════
         THE SIX VERBS

         None of them names a manipulative and none of them ever will. Each one looks the current
         level up in the curriculum, finds the plugin it names, and calls the matching method —
         so a new manipulative arrives with the registry entry and nothing here is touched.

         What she is looking at reaches her through the RESULT, in `explain`, rather than through
         the tool's name. That is the trade that keeps the list at six: a generic verb tells the
         model less than `show_bezier_control_points` would, and the return value gives it back.
      ══════════════════════════════════════════════════════════════════════════ */
      const VERBS = {
        next_task: {
          description:"The next thing to work on. The system sets the difficulty — never invent your own. If they asked for a topic, or for easier or harder, pass their own words as want. Ten per run.",
          parameters:{ type:"object", properties:{ want:{ type:"string",
            description:"What they asked for, in their words — a topic, or easier / harder. Leave it out if they did not ask for anything." } } },
          execute: ({ want }) => {
            if (done >= RUN) return { ok:false, finished:true, note:"ten done — call celebrate kind=finished" };
            if (!t0) t0 = performance.now();
            /* Their request is honoured HERE, before the task is made, and it can be honoured in
               either of two places: `resolveWant` may move the level, and the same words then go
               to `gen`, which may pick a different question inside it. Both are the curriculum's
               decision and neither is hers.

               THE WORDS ARE NOT PASSED ON WHEN THEY WERE SPENT ON THE MOVE. "harder" that took
               them from Pythagoras to Bézier is finished — handing it to Bézier's `gen` as well
               makes the rings smaller too, so one request lands twice and the jump is twice what
               they asked for. */
            const req = resolveWant(want);
            const hint = req.direction ? null : want;
            if (active) { active.unmount(); active = null; }
            $("work").innerHTML = "";
            setTask({ ...level.gen(hint), helped:false }, true);
            renderQ(null); hud();
            /* Whether the ask was met is the LEVEL's answer, not a guess from the phrasing: a
               `gen` that used the hint says so with `asked`. She has to be able to tell them
               plainly when the course has nothing for them. */
            const honoured = req.moved || task.asked === true;
            return { level: level.name, index: done+1, of: RUN,
                     say: level.say(task),
                     ...(req.asked ? {
                       asked_for: String(want).slice(0, 60),
                       honoured,
                       note: honoured
                         ? `their request was honoured — this is ${level.name}`
                         : req.direction
                           ? `there is nothing ${req.direction} in the course than ${level.name} — `
                             + "tell them that plainly"
                           : "nothing in the course matches that, so this is simply the next task on "
                             + "the level they are on. Say so plainly rather than pretending" } : {}) };
          } },
        show: {
          description:"Put the current task on the workspace. It picks the right picture for this level by itself.",
          parameters:{ type:"object", properties:{} },
          execute: () => {
            if (!task) return { ok:false, error:"call next_task first" };
            return { ok:true, ...mountFor(task) };
          } },
        demonstrate: {
          description:"Show the method for this task — things move on screen. Use it when they get it wrong.",
          parameters:{ type:"object", properties:{} },
          execute: () => {
            if (!task) return { ok:false, error:"call next_task first" };
            if (!active) mountFor(task);               // she may demonstrate without showing first
            if (!active) return { ok:false, error:"no manipulative for this level" };
            task.helped = true;
            /* Returns at once, every time. The worker aborts a tool at TOOL_DEADLINE_MS and the
               animation runs on the page regardless — awaiting it is pure dead air. */
            const out = active.demonstrate(task) ?? {};
            Trace.work("demonstrate", active.id, out.explain ?? "");
            return { ok:true, note:"it is moving on screen now", ...out };
          } },
        answer: {
          description:"Submit and check their answer. Fill heard if you caught it, leave it out if not. Never say right or wrong before calling this.",
          parameters:{ type:"object", properties:{ heard:{ type:"number" } } },
          execute: ({ heard }) => {
            if (!task) return { ok:false, error:"no task yet" };
            /* Once is enough. She is told the moment the workspace comes to rest on a right
               answer, and a push she answers twice is a question counted twice against the run
               of ten. A WRONG answer deliberately does not latch: the brief tells her to
               demonstrate and let them try again, and they must be able to. */
            if (task.marked) return { answered:false, already_right:true,
              note:"they already got this one — call next_task" };
            /* Marking mid-drag is marking a hand that has not landed. Before the quiet gate, a
               silent ten-second check that happened to land during a drag read the workspace
               half-moved and scored it. `busy` opens the moment the answer on screen is right,
               which is what stops the push below racing its own gate. */
            if (typeof heard !== "number" && Activity.busy())
              return { answered:false, still_working:true,
                       note:"they are still moving it — wait a few seconds and check again" };
            // Four ways in — her ears, the keypad, the box under the board, and the workspace —
            // and the LEVEL decides which of them counts and what counts as right.
            const work = active?.read?.() ?? null;
            const given = level.answerFrom({ heard, tapped, typed, work });
            if (given == null) return { answered:false,
              note: level.input === "workspace"
                ? "they have not moved the workspace yet — wait, or tell them to drag it"
                : "nothing said, nothing typed or tapped and nothing on the workspace — wait, or suggest working on screen" };
            /* Captured before the reset below, not after. `tapped = null` runs first, so the
               old version computed this against variables it had just cleared and reported
               "workspace" for every answer including the ones it had heard. */
            const source = typeof heard === "number" ? "listened"
                         : typed != null ? "typed" : tapped != null ? "tapped" : "workspace";
            const verdict = level.check(task, given);
            const ok = verdict.correct;
            if (ok) task.marked = true;
            done++; if (ok) { right++; streak++; wrongRun = 0; } else { streak = 0; wrongRun++; }
            history.push({ ...task, ok });
            renderQ(given); hud(); tapped = null; typed = null;
            if (ok) { Sfx.play("correct"); Juice.shake(.16); Juice.pop($("ans")); Juice.confetti(14); }
            else { Sfx.play("wrong"); Juice.shake(.24); Juice.pop($("ans"),.88,1.14); }
            let up = false;
            if (ok && streak >= 3) { up = shift(+1); if (up) { streak = 0;
              Sfx.play("levelup"); Juice.shake(.4); Juice.confetti(46); } hud(); }
            if (!ok && wrongRun >= 2) { if (shift(-1)) wrongRun = 0; hud(); }
            return { answered:true, value:given, correct:ok, expected:verdict.expected,
                     source,
                     levelled_up: up, now_on: level.name, remaining: RUN-done };
          } },
        progress: {
          description:"How far they have got.",
          parameters:{ type:"object", properties:{} },
          execute: () => ({ done, right, streak, of: RUN,
                            level: level.name, strand: STRAND_NAMES[level.strand],
                            difficulty: level.difficulty }) },
        celebrate: {
          description:"Feedback at the clear moments: correct / levelup / finished. Call it before you speak.",
          parameters:{ type:"object", properties:{ kind:{ type:"string", enum:["correct","levelup","finished"] } },
                       required:["kind"] },
          execute: ({ kind }) => {
            if (kind === "correct") { Juice.confetti(12); return { ok:true, say_hint:"praise briefly" }; }
            if (kind === "levelup") return { ok:true, level: level.name,
              say_hint:`tell them they have reached ${level.name}` };
            reportCard();
            return { ok:true, right, done, say_hint:"say the run is done, praise, ask about another" };
          } },
      };

      /* ══ WHAT THEY DID WHILE SHE WAS NOT ASKING ═══════════════════════════════
         The piggyback, with two rules the raw queue never had — and one thing that does not ride
         it at all, because it cannot afford to.

         QUIET. Nothing is handed over until they have stopped for QUIET_MS. A drag emits an event
         per unit of travel, so without this she is handed a hand that is still moving and talks
         over the gesture — and `answer` grades a half-finished drag as if it were the answer.
         While they are still going she gets `still_working` and nothing else, which her brief
         tells her means "say nothing about it yet".

         SUMMARY. The same event repeated is one line with a count, not fifteen. Tuning the
         Fourier mixer queued fifteen `fit` events in four seconds; she needs the last one and
         the fact that there were fifteen, not the other fourteen.

         AND THE THING THAT CANNOT WAIT FOR HER TO ASK. Everything above only reaches her on her
         next tool call, and her brief has her checking every eight to ten seconds. For "what have
         they been up to" that is fine. For "they have just solved it" it is not: a learner who
         matches the grey wave sits in front of a finished screen for the rest of that window
         while the teacher talks about something else, and what that feels like is a teacher who
         is not watching. So a FINISH takes the floor — `interrupt` below sends it as a turn on
         the same `lk.chat` topic the text box uses, and she is cut off mid-sentence by it.

         Two things earn that and nothing else does: the workspace coming to rest on an answer the
         level marks correct, and an event a manipulative tagged `tell` (a milestone that is not
         the answer — completing a Pythagoras rearrangement is the one). A slider frame does not
         earn it and never will; that is the whole reason `since_last_call` exists. */
      const QUIET_MS = 1800, POLL_MS = 250, LAND_MS = 650;
      /**
       * The page taking the floor, in the learner's stead.
       *
       * `lk.chat` is page → agent and it arrives as a turn, so this lands mid-word and she deals
       * with it — the same mechanism, and the same justification, as the box under the board.
       * `sentByUs` is what stops the echo coming back through `TranscriptionReceived` and being
       * captioned as something the learner said.
       */
      function interrupt(text) {
        if (!room) return void Trace.work("workspace milestone", text, "no call — nobody to tell");
        sentByUs.add(text);
        room.localParticipant.sendText(text, { topic:"lk.chat" })
          .then(() => Trace.work("told her at once", text, "pushed on lk.chat, as a turn"))
          .catch((e) => { sentByUs.delete(text);
            Trace.err("milestone not pushed", String(e?.message ?? e)); });
      }
      const Activity = (() => {
        let pending = [], lastAt = 0, landed = false, told = new Set();
        const pull = () => {
          const fresh = active?.events?.() ?? [];
          if (fresh.length) { pending.push(...fresh); lastAt = performance.now(); }
          /* A `tell` is a manipulative saying "this one is worth being interrupted for". Deduped
             per task, because flipping a Pythagoras arrangement back and forth is one piece of
             news each way and not one per flip. */
          for (const e of fresh) {
            if (!e.tell || told.has(e.tell)) continue;
            told.add(e.tell);
            interrupt(`WORKSPACE: ${e.tell}`);
          }
        };
        /**
         * Has the workspace come to rest on a right answer?
         *
         * CORRECT ONLY, and that is a decision rather than an oversight. A learner sweeping the
         * radius round to sin θ = 0.5 pauses at 0.3 on the way, and a detector that fired on any
         * settled value would hand her a wrong answer to mark out of a gesture that was not
         * finished. Landing on the right answer is unambiguous: it is the end of the task. A
         * wrong one still reaches her, on her next check, exactly as before.
         *
         * LAND_MS, not QUIET_MS. The point of this is that it is immediate; two-thirds of a
         * second is long enough to rule out passing through the answer mid-drag and short enough
         * that the praise still belongs to the thing they just did.
         */
        const checkLanded = () => {
          if (landed || !task || !tutorLed) return;
          if (level.input !== "workspace") return;    // the keypad levels answer through her
          if (performance.now()-lastAt < LAND_MS) return;
          const v = active?.read?.()?.value;
          if (v == null || !level.check(task, v).correct) return;
          landed = true;
          interrupt("WORKSPACE: they have stopped and there is an answer on screen. Check it now.");
        };
        /* Drained on a timer, not only when she asks. Stamping `lastAt` at collection time made
           the age of an event the age of her *question*: a learner who moved something once and
           then sat still for thirty seconds was reported as still working, because the event had
           been sitting in the manipulative's queue looking fresh the whole time. */
        setInterval(() => { pull(); checkLanded(); }, POLL_MS);
        const squash = (evts) => {
          const by = new Map();
          for (const e of evts) {
            const prev = by.get(e.t);
            by.set(e.t, { ...prev, ...e, times: (prev?.times ?? 0) + 1 });
          }
          return [...by.values()];
        };
        return {
          /** Everything a new task has to forget. */
          reset() { pending = []; lastAt = 0; landed = false; told.clear(); },
          /** True while their hand is still on it. Checked by `answer` before it marks anything. */
          busy() { pull(); return !landed && pending.length > 0 && performance.now()-lastAt < QUIET_MS; },
          collect() {
            pull();
            if (!pending.length) return null;
            if (!landed && performance.now()-lastAt < QUIET_MS)
              return { still_working: true, note: "their hand is still on it — say nothing yet" };
            const since_last_call = squash(pending);
            pending = [];
            return { since_last_call };
          },
        };
      })();

      /* Trace, time, and hand back anything that happened on the workspace since her last call.
         Every result carries it, so whichever tool she reaches for next is the one that delivers
         the news. A page CAN push — that is what the text box does — but pushing a drag would
         interrupt her once per frame, so the workspace rides here instead. */
      /** How long after a clean registration to stop believing she is about to speak. */
      const SILENCE_MS = 15000;
      const TOOL_NAMES = Object.keys(VERBS);
      const ToolStat = Object.fromEntries(TOOL_NAMES.map((n) => [n, { calls:0, last:null, ms:null }]));
      const TOOLS = Object.fromEntries(Object.entries(VERBS).map(([name, def]) => [name, {
        ...def,
        execute: async (args, ctx) => {
          const t = performance.now();
          try {
            let out = await def.execute(args ?? {}, ctx);
            const news = Activity.collect();
            if (news && out && typeof out === "object") out = { ...out, ...news };
            const t1 = performance.now();
            const st = ToolStat[name];
            st.calls++; st.ms = Math.round(t1-t); st.last = JSON.stringify(out);
            if ($("tools").classList.contains("on")) renderTools();
            Trace.tool(name, args && Object.keys(args).length ? args : "", out, Math.round(t1-t));
            return out;
          } catch (e) { Trace.err(name, String(e?.message ?? e)); throw e; }
        },
      }]));

      /* ══ RAIL PANES ══════════════════════════════════════════════════════════ */
      let regInfo = { accepted: [], rejected: [], briefChars:null };
      function renderTools() {
        const acc = new Set(regInfo.accepted);
        const rows = TOOL_NAMES.map((n) => {
          const st = ToolStat[n], def = VERBS[n];
          const on = acc.has(n), keys = Object.keys(def.parameters?.properties ?? {});
          return `<div class="tool ${st.calls ? "hit" : ""} ${regInfo.accepted.length && !on ? "rej" : ""}">
            <div class="h"><span class="n">${on ? "✓" : regInfo.accepted.length ? "✗" : "·"} ${n}</span>
              <span class="c">${st.calls} call${st.calls === 1 ? "" : "s"}${st.ms != null ? ` · ${st.ms}ms` : ""}</span></div>
            <div class="d">${def.description}</div>
            <div class="p">params: ${keys.length ? keys.join(", ") : "none"}</div>
            ${st.last ? `<div class="last">last → ${String(st.last).slice(0,150)}</div>` : ""}
          </div>`; }).join("");
        const rej = regInfo.rejected.length
          ? `<div class="tool rej"><div class="h"><span class="n">rejected</span></div>
             <div class="d">${JSON.stringify(regInfo.rejected)}</div></div>` : "";
        $("tools").innerHTML = `<div class="banner">
          <b>${TOOL_NAMES.length}</b> tools · <b>${Object.keys(MANIPULATIVES).length}</b> manipulatives ·
          <b>${CURRICULUM.length}</b> curriculum levels<br>
          The first number does not move when the other two do. That is the whole design.
          </div><div class="thead">deadline <b>${TOOL_DEADLINE_MS}ms</b>${
          regInfo.briefChars ? ` · brief <b>${regInfo.briefChars}</b>/4000` : ""}
          ${regInfo.accepted.length ? "" : "<br><span style=\"color:#c98a3a\">not connected yet — local definition</span>"}
          </div>${rows}${rej}`;
      }
      function renderRegistry() {
        const impl = new Set(Object.keys(MANIPULATIVES));
        const byStrand = {};
        for (const l of CURRICULUM) (byStrand[l.strand] ??= []).push(l);
        const levels = Object.entries(byStrand).map(([s, ls]) =>
          `<div class="thead" style="margin-top:10px"><b>${STRAND_NAMES[s]}</b></div>` +
          ls.sort((a,b) => a.difficulty-b.difficulty).map((l) => `<div class="reg">
            <span class="n ${l.gen ? "" : "soon"}">${l.gen ? "✓" : "·"} ${l.id}</span>
            <div class="m">ages <b>${l.ages[0]}-${l.ages[1]}</b> · difficulty <b>${l.difficulty}</b>
              · manipulative <b>${l.manipulative}</b>${impl.has(l.manipulative) ? "" : " <span style=\"color:#c98a3a\">(not built)</span>"}
              ${l.planned ? `· <span style="color:#c98a3a">${l.planned}</span>` : ""}</div></div>`).join("")).join("");
        /* `takesInput` is true for nine out of nine now, so it has stopped telling anyone
           anything. What varies is the gesture, and the plugin already states that once, in the
           sentence the workspace prints under itself. */
        const plugs = Object.values(MANIPULATIVES).map((m) => `<div class="reg">
          <span class="n">✓ ${m.id}</span>
          <div class="m">ages <b>${m.ages[0]}-${m.ages[1]}</b>
            · methods <b>mount, demonstrate, read, events, unmount</b>
            ${m.hint ? `<br>· <b>${m.hint.replace(/[<>&]/g, "")}</b>` : "· <b>no input</b>"}</div></div>`).join("");
        $("registry").innerHTML = `<div class="banner">
          Adding a manipulative costs <b>0</b> tool slots and <b>0</b> characters of her brief.
          It is a key in one table and an id in the other.</div>
          <div class="thead"><b>MANIPULATIVES</b> — the plug point</div>${plugs}
          <div class="thead" style="margin-top:12px"><b>CURRICULUM</b> — data, not control flow</div>${levels}`;
      }
      document.querySelectorAll("#trace .tab").forEach((b) => b.onclick = () => {
        document.querySelectorAll("#trace .tab").forEach((x) => x.classList.toggle("on", x === b));
        document.querySelectorAll("#trace .pane").forEach((p) => p.classList.toggle("on", p.id === b.dataset.t));
        if (b.dataset.t === "tools") renderTools();
        if (b.dataset.t === "registry") renderRegistry();
      });
      renderTools(); renderRegistry();

      /* ══ COURSE PICKER ═══════════════════════════════════════════════════════
         Behind the level button, over the workspace, rather than laid out permanently above it.
         Eleven levels on the page at all times pushed her face and the manipulative into the
         bottom third of the window, and a chooser you touch once a session does not earn that. */
      (() => {
        const byStrand = {};
        for (const l of CURRICULUM) (byStrand[l.strand] ??= []).push(l);
        $("course").innerHTML = Object.entries(byStrand).map(([s, ls]) => `<div class="strand">
          <h4>${STRAND_NAMES[s]}</h4><div class="lvls">${ls.sort((a,b)=>a.difficulty-b.difficulty).map((l) => `
            <div class="lvl ${l.gen ? "" : "soon"}" data-id="${l.id}">
              <div class="nm">${l.name}</div>
              <div class="mt"><span>ages ${l.ages[0]}–${l.ages[1]}</span>
                <span class="d"><i style="width:${l.difficulty*10}%"></i></span>
                ${l.planned ? `<span class="tag">${l.planned}</span>` : ""}</div>
            </div>`).join("")}</div></div>`).join("");

        const open = (v) => { $("course").classList.toggle("on", v);
          $("lvchip").classList.toggle("open", v); };
        $("lvchip").onclick = () => { open(!$("course").classList.contains("on")); Sfx.play("tap"); };
        document.addEventListener("pointerdown", (e) => {
          if (!$("course").contains(e.target) && !$("lvchip").contains(e.target)) open(false); });
        $("course").onclick = (e) => {
          const el = e.target.closest(".lvl"); if (!el || el.classList.contains("soon")) return;
          level = RUNNABLE.find((l) => l.id === el.dataset.id);
          save.levelId = level.id; persist();
          Sfx.play("tap"); Trace.fx("level picked", level.id);
          open(false);
          preview();
        };
      })();

      /* ══ VOICE LAB ═══════════════════════════════════════════════════════════
         A wrong voice id is accepted by the platform and then just sounds like someone else, so
         the only instrument that settles it is an ear. This picks a preset NAME out of the
         registry — never a spec, which would be a way to post arbitrary JSON into the mint. */
      let voicePreset = null;
      (async () => {
        const presets = await (await fetch("/api/voices")).json();
        Trace.http("GET /api/voices","",`${presets.length} presets`);
        $("voicesel").innerHTML = `<option value="">voice: as assigned</option>` +
          presets.map((p) => `<option value="${p.name}">${p.placeholder ? "⚠ " : ""}${p.name} · ${p.provider}${
            p.verified ? "" : " · unverified"}</option>`).join("");
        const ph = new Set(presets.filter((p) => p.placeholder).map((p) => p.name));
        $("voicesel").onchange = (e) => {
          voicePreset = e.target.value || null;
          $("voicesel").classList.toggle("ph", ph.has(voicePreset));
          setupSummary();
          Trace.fx("voice preset", voicePreset ?? "as assigned");
          if (ph.has(voicePreset))
            $("says").textContent = "That preset still has a REPLACE_WITH_ placeholder — it cannot resolve.";
        };
        for (const p of presets.filter((p) => p.placeholder))
          Trace.err("voice placeholder", `${p.name} — edit VOICE_PRESETS in server.mjs before trying it`);
      })().catch((e) => Trace.err("voices", String(e)));

      /* ══ MOTION AND THE ROOM ═════════════════════════════════════════════════
         Both are two-state buttons that show the state they are in. Dark or light is the frame
         only — the board stays white — and it is a real preference rather than a demo switch,
         so it persists and it honours the system setting the first time round. */
      let calm = false;
      const setMotion = (v) => { calm = v; Juice.setCalm(v);
        $("mo").textContent = v ? "reduced" : "motion"; };
      $("mo").onclick = () => { setMotion(!calm); Sfx.play("tap"); Trace.fx("motion", calm ? "reduced" : "on"); };
      setMotion(matchMedia("(prefers-reduced-motion: reduce)").matches);

      /* Versioned for the same reason the session state is: a stored "dark" from before the
         default changed would outlive the change and look like it never happened. */
      const THEME_KEY = "ms_theme.v2";
      const setTheme = (t) => {
        document.body.classList.toggle("lite", t === "lite");
        $("th").textContent = t === "lite" ? "light room" : "dark room";
        localStorage.setItem(THEME_KEY, t);
      };
      $("th").onclick = () => {
        const next = document.body.classList.contains("lite") ? "dark" : "lite";
        setTheme(next); Sfx.play("tap"); Trace.fx("room", next);
      };
      /* Light by default. The board is white in both themes, so the light room is the one where
         the page and the thing being taught are the same surface — the dark room is for a
         darkened classroom, which is the exception. A stored choice still wins over both, and
         the OS preference is no longer consulted: it is a preference about operating systems,
         not about whether a maths workspace reads better on paper. */
      localStorage.removeItem("ms_theme");       // v1, superseded
      setTheme(localStorage.getItem(THEME_KEY) ?? "lite");

      /* The one line the collapsed setup drawer shows. Everything inside it is set once a session,
         so the summary has to say enough that you know whether you need to open it — and it turns
         red when the microphone is the thing that is wrong, because that is the one setting whose
         being wrong is not obvious until the call is already running. */
      function setupSummary() {
        $("setupsum").textContent = voicePreset ?? "voice as assigned";
        $("setup").classList.toggle("warn", $("micmsg").classList.contains("bad"));
      }
      setupSummary();   // seed it on boot; after that only the voice and mic handlers touch it

      /* ══ KEYPAD ══════════════════════════════════════════════════════════════ */
      let tapped = null;
      $("pad").innerHTML = Array.from({length:21},(_,i) => `<button data-n="${i}">${i}</button>`).join("");
      $("pad").onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
        Juice.pop(b,1.18,.84); Sfx.play("tap");
        if (!task) { $("says").textContent = "No task yet — wait for the teacher."; return; }
        tapped = Number(b.dataset.n);
        Trace.work("learner tapped", tapped, "staged for her next answer call");
        $("says").textContent = `Tapped ${tapped} — waiting for the teacher.`; };

      /* ══ TYPING TO HER ═══════════════════════════════════════════════════════
         One box, two jobs, because they are the same act: you type something and she finds out.
         If it parses as a number it also becomes the answer, exactly as a tap would — the levels
         that hide the keypad ignore it, because the answer to "thread both rings" is the number
         two and a text box next to that question is a button marked win.

         THE TEXT ITSELF IS A TURN. `sendText` on the `lk.chat` topic is the page → agent channel,
         and a line arriving on it lands the way a sentence out loud does: she takes the floor from
         herself and answers it. So typing INTERRUPTS her, mid-word, which is the whole reason to
         put a box under a talking teacher — a learner who is lost at second three of the
         explanation should not have to sit through the other twenty to say so.

         Which is exactly why the workspace does not use this channel for everything. A drag fires
         events by the frame and the Fourier mixer fired fifteen in four seconds; as turns that is
         fifteen interruptions, and she would never finish a sentence. Those ride `since_last_call`
         on her next tool call instead — ambient, and gated on a hand that has stopped moving.

         Two channels, and the question that picks between them is whether the thing that just
         happened has earned the right to take the floor. Typing has. Moving a slider has not.
         FINISHING has, which is the one case `interrupt` above sends here on the workspace's
         behalf: it happens once per task, and a learner who has just matched the grey wave should
         not wait out the rest of her sentence to hear about it. */
      let typed = null;
      /** Our own lines come back as transcription. Kept so the caption can tell who said what. */
      const sentByUs = new Set();
      const clip = (s, n = 40) => s.slice(0, n).replace(/[<>&]/g, "");
      $("tell").onsubmit = async (e) => {
        e.preventDefault();
        const text = $("tellin").value.trim();
        if (!text) return;
        $("tellin").value = "";
        Sfx.play("tap");
        // A bare number is an answer; "12 apples" is not, and neither is "−3" with a real minus.
        const n = /^-?\d+(\.\d+)?$/.test(text) ? Number(text) : null;
        const answerable = n != null && level.input !== "workspace";
        if (answerable) typed = n;

        /* No room, no channel. Staging the number is still worth doing — it is waiting for the
           first `answer` call of the next session — but the sentence had nowhere to go, and
           saying so is the whole difference between a quiet failure and an explained one. */
        if (!room) {
          $("tellnote").innerHTML = answerable
            ? `<b>${n}</b> is staged as their answer — start the call and she will check it.`
            : "She is not in the room yet — start the call, then type.";
          Trace.work("learner typed", text, "no call — nowhere to send it");
          return;
        }

        sentByUs.add(text);
        try {
          await room.localParticipant.sendText(text, { topic: "lk.chat" });
        } catch (err) {
          sentByUs.delete(text);
          $("tellnote").innerHTML = `<b>“${clip(text)}”</b> did not send — ${clip(String(err?.message ?? err), 80)}`;
          Trace.err("typed line not sent", err?.message ?? String(err));
          return;
        }
        Trace.say(text, "you");
        $("tellnote").innerHTML = answerable
          ? `<b>${n}</b> is with her now, and staged as their answer.`
          : `<b>“${clip(text)}”</b> is with her now.`;
        Trace.work("learner typed", text,
          answerable ? `sent on lk.chat; answer ${n} staged` : "sent on lk.chat");
      };

      /* ══ MICROPHONE ══════════════════════════════════════════════════════════
         Six things can stop a microphone and they have six different fixes, so nothing here
         branches on `NotAllowedError` itself — `enableMicrophone` does the classifying and hands
         back a REASON and the sentence that names the fix. Two of them are why it is worth the
         import: a macOS denial reads as a browser denial and is fixed in System Settings with a
         browser restart, and an unanswered prompt may per spec never settle at all, so the wait
         has to have a deadline or the page hangs mid-connect with no error to show.

         LIVE BUT SILENT is the seventh and it is not one of the six, because nothing rejects: the
         device enumerates, getUserMedia hands back a track, `readyState` is "live", `muted` is
         false, and every sample is zero. An iPhone on Continuity does it whenever the phone is
         asleep; so does a virtual input with nothing routed into it, and so does hardware muted
         below the browser. Only a meter finds it, which is why the meter is on the panel and not
         behind the drawer — and why the DEVICE NAME goes next to the verdict. "Silent" on its own
         is not actionable; "MacBook Pro Microphone is silent" is. */
      /** One word on the panel, the detail in the drawer, and the drawer's summary goes red with
       *  it. Everything that knows something about the microphone routes through here.
       *
       *  A bad state also OPENS the drawer. The one control that fixes most of these is the device
       *  picker, and leaving it folded away behind a summary that has merely turned red means the
       *  fix is one click further away than the problem. */
      function micState(word, bad = false) {
        $("micstate").textContent = word;
        $("micbar").classList.toggle("bad", bad);
        $("micmsg").classList.toggle("bad", bad);
        if (bad) $("setup").open = true;
        setupSummary();
      }
      const isContinuity = (l = "") => /iphone|ipad|continuity/i.test(l);
      const isBuiltIn = (l = "") => /macbook|built-?in|内置|麦克风/i.test(l);
      /** The input the call should publish: one a meter has PROVEN, or one the user picked by
       *  hand. Never the boot heuristic's guess — that is a suggestion for the self-test, and
       *  forcing a guessed device onto the call can replace a working default with a silent one. */
      let micChoice = null;
      let meterStop = null, testTrack = null;
      /** Inputs already proven silent this session, so the hunt below cannot loop on one. */
      const micTried = new Set();
      /**
       * A silent input is a dead end the page can walk out of by itself.
       *
       * Telling somebody "check System Settings > Sound" is telling them to go and debug their
       * operating system, and the commonest causes here are not settings at all: a paired iPhone
       * that Continuity offers as a microphone whenever it is asleep, a virtual device with
       * nothing routed into it, a headset that disconnected its input but not its output. In all
       * of them ANOTHER input on the same machine works fine. So try them.
       *
       * Only ever entered from proof — three seconds of a live track whose every sample is zero
       * — so it cannot take a working microphone away from anybody. It stops when something is
       * heard or when the machine runs out of inputs, and it says which it was.
       */
      async function huntForALiveInput(fromId, tag) {
        micTried.add(fromId ?? "default");
        const ds = (await navigator.mediaDevices.enumerateDevices())
          .filter((d) => d.kind === "audioinput" && d.deviceId && d.deviceId !== "communications");
        /* Deduplicate by groupId first. `enumerateDevices` lists one physical microphone twice —
           once under its own id and once as the "default" alias pointing at it — so a hunt that
           only tracks ids spends its second attempt re-testing the device that just failed, and
           reports one more silent input than the machine actually has. */
        const triedGroups = new Set(ds.filter((d) => micTried.has(d.deviceId)).map((d) => d.groupId));
        // Continuity last: it is the one that reliably hands back a live track and no audio.
        const left = ds.filter((d) => !micTried.has(d.deviceId) && !triedGroups.has(d.groupId))
          .sort((a, b) => (isContinuity(a.label) ? 1 : 0) - (isContinuity(b.label) ? 1 : 0));
        if (!left.length) {
          $("micmsg").textContent += ` Every input on this machine has now been tried `
            + `(${micTried.size}) and all of them were silent, so the problem is below the browser: `
            + `check macOS System Settings > Sound > Input and watch whether the level moves when `
            + `you speak.`;
          Trace.err("mic hunt", `exhausted — ${micTried.size} input(s), all silent`);
          return;
        }
        const next = left[0];
        Trace.mic("trying another input", next.label || next.deviceId, `${tag} was silent`);
        $("micmsg").textContent += ` Trying "${(next.label || "the next input").slice(0, 24)}"…`;
        $("micdev").value = next.deviceId;
        micChoice = next.deviceId;
        if (room) {
          await room.switchActiveDevice("audioinput", next.deviceId, true);
          const t = room.localParticipant.getTrackPublication("microphone")?.track;
          if (t) runMeter(t, "in-call");
        } else {
          await testMic(next.deviceId);
        }
      }
      function runMeter(lkTrack, tag) {
        meterStop?.();
        const { calculateVolume, cleanup } = createAudioAnalyser(lkTrack, { smoothingTimeConstant:.2 });
        const ms = lkTrack.mediaStreamTrack;
        const label = (ms?.label || "this input").slice(0, 28);
        const short = label.length > 17 ? label.slice(0, 16) + "…" : label;
        const id = ms?.getSettings?.().deviceId;
        let peak = 0, heard = false, raf = 0, maxV = 0, warned = false;
        const st = performance.now();
        (function tick() {
          const v = calculateVolume(); maxV = Math.max(maxV, v);
          if (v > .004 && !heard) { heard = true; micState("live");
            micChoice = id ?? micChoice;
            micTried.clear();          // this one works; a later failure gets the full list again
            Trace.mic("signal", tag, `${label} · peak ${(maxV*1000).toFixed(0)}`); }
          peak = Math.max(Math.min(1, v*6), peak*.9);
          $("miclv").style.width = (peak*100).toFixed(0)+"%";
          if (heard) { if ($("micmsg").classList.contains("bad")) { $("micmsg").classList.remove("bad"); setupSummary(); }
            $("micmsg").textContent = `${label} · live · ${(maxV*1000).toFixed(0)}`; }
          else if (!warned && performance.now()-st > 3000) {
            warned = true;
            micState(`${short} — silent`, true);
            $("micmsg").textContent = isContinuity(ms?.label)
              ? `"${label}" is an iPhone Continuity mic — it hands back a live track and stays `
                + `silent unless the phone is awake.`
              : `"${label}" is live (muted:${ms?.muted}, ${ms?.readyState}) and every sample is zero.`;
            Trace.err("mic silent", `${ms?.label} muted:${ms?.muted} — ${tag}`);
            huntForALiveInput(id, label).catch((e) => Trace.err("mic hunt", String(e?.message ?? e)));
          }
          raf = requestAnimationFrame(tick);
        })();
        meterStop = () => { cancelAnimationFrame(raf); cleanup?.().catch(()=>{}); };
      }
      async function listMics(activeId) {
        const ds = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
        $("micdev").innerHTML = ds.map((d,i) =>
          `<option value="${d.deviceId}">${(d.label || `input ${i+1}`).slice(0,24)}</option>`).join("");
        if (activeId) $("micdev").value = activeId;
        return ds;
      }
      /** The one place a microphone failure is turned into something on screen. `reason` is the
       *  panel's word because it is already the short name of the cause, and inventing a second
       *  vocabulary for it is inventing something to keep in sync. */
      function micFailed(mic, where) {
        micState(mic.reason, true);
        $("micmsg").textContent = `${mic.message} — ${mic.hint}`;
        Trace.err(`mic ${where}`, `${mic.reason} — ${mic.message}`);
      }
      async function testMic(deviceId) {
        micState("testing…"); $("micmsg").textContent = "…";
        await testTrack?.stop();
        /* `enableMicrophone` asks for anything with a `localParticipant.setMicrophoneEnabled` —
           the interface is structural on purpose, so the self-test can borrow it before there is
           a room to hand it. What that buys here is the deadline and the named causes. */
        const mic = await enableMicrophone({ localParticipant: { setMicrophoneEnabled: async () => {
          testTrack = await createLocalAudioTrack(deviceId ? { deviceId:{ exact: deviceId } } : {});
        } } });
        if (!mic.ok) return void micFailed(mic, "test");
        await listMics(testTrack.mediaStreamTrack.getSettings().deviceId);
        $("micmsg").textContent = "listening…";
        runMeter(testTrack, "self-test");
      }
      /* `enableMicrophone` never throws, but enumerating devices after it can — and this runs from
         a click, where a rejection is an unhandled promise nobody is looking at. */
      const runTest = (id) => testMic(id).catch((e) => {
        micState("failed", true);
        $("micmsg").textContent = String(e?.message ?? e);
        Trace.err("mic test", String(e?.message ?? e));
      });
      $("mictest").onclick = () => { micTried.clear(); runTest($("micdev").value || null); };
      /**
       * Picking a device has to mean it DURING a call as well, and this is where it did not.
       * The handler only ever ran the self-test, which opens a second, separate track — so on a
       * live call you could watch the picker prove a working microphone while the call went on
       * publishing the silent one. The meter said "live", the tutor still heard nothing, and
       * nothing on the page connected the two.
       *
       * `switchActiveDevice` replaces the input on the published track, which is the only thing
       * that changes what she hears. `true` is exact: without it deviceId is a hint the browser
       * may ignore, and being quietly ignored is the failure we are here to fix.
       */
      $("micdev").onchange = async () => {
        const id = $("micdev").value;
        micChoice = id || null;              // an explicit choice, so the next call starts here too
        micTried.clear();                    // and a fresh start for the hunt if this one is silent
        if (!room) return void runTest(id);
        try {
          await room.switchActiveDevice("audioinput", id, true);
          const t = room.localParticipant.getTrackPublication("microphone")?.track;
          if (t) runMeter(t, "in-call");
          Trace.mic("switched", $("micdev").selectedOptions[0]?.textContent ?? id, "on the live call");
        } catch (e) {
          micState("switch failed", true);
          $("micmsg").textContent = `Could not move the call to that input: ${e?.message ?? e}`;
          Trace.err("mic switch", String(e?.message ?? e));
        }
      };
      /* A first guess, and only a guess: labels are the only signal available before anything has
         been heard, and they are localised, so this ranks rather than decides. Continuity goes
         last because it is the one that hands back a live silent track. Whatever it picks is a
         suggestion for the self-test — `micChoice` stays null until a meter or a human confirms
         one, and the call uses the system default until then. */
      (async () => {
        const ds = await listMics();
        if (!ds.length || !ds[0].label) return;
        const best = ds.find((d) => isBuiltIn(d.label) && !isContinuity(d.label))
                  ?? ds.find((d) => !isContinuity(d.label) && !/^default/i.test(d.label))
                  ?? ds.find((d) => !isContinuity(d.label)) ?? ds[0];
        $("micdev").value = best.deviceId;
      })().catch(() => {});

      /* ══ TEACHERS ════════════════════════════════════════════════════════════
         Three circles under her own panel, and picking one swaps the face above them. Her name
         and blurb move into the caption block, because that is the one place on the page where
         a sentence in her voice belongs. */
      /* Her face before there is a video track comes from the server, at /portrait/<slug>: a
         picture if the cast ships one, a monogram drawn from the name if it does not. The page
         does not need to know which — either way it is one URL per character. */
      let chosen = null;
      (async () => {
        const roster = await (await fetch("/api/teachers")).json();
        Trace.http("GET /api/teachers","",`${roster.length} teachers`);
        $("pick").innerHTML = roster.map((t) => `
          <button class="who" data-slug="${t.slug}" data-name="${t.name}" data-blurb="${t.blurb}"
                  title="${t.name} — ${t.blurb}"><img src="/portrait/${t.slug}" alt="${t.name}" /></button>`).join("");
        $("pick").onclick = (e) => { const el = e.target.closest(".who"); if (!el) return;
          chosen = el.dataset.slug; $("still").src = `/portrait/${chosen}`;
          $("whoname").textContent = `${el.dataset.name} · ${el.dataset.blurb}`;
          Sfx.play("tap"); Juice.pop(el,1.06,.94); Trace.fx("teacher", chosen);
          $("pick").querySelectorAll(".who").forEach((x) => x.classList.toggle("on", x === el)); };
        $("pick").querySelector(".who")?.click();
      })().catch((e) => Trace.err("teachers", String(e)));

      /* ══ CALL ════════════════════════════════════════════════════════════════ */
      let room = null, sessionId = null, herSpoke = false, silenceTimer = 0, herPeak = 0;
      /** Her audio meter's cancel, held here so the call teardown can reach it. */
      let herMeterStop = null;
      /** Everything per-frame this call started. Called on End, on Disconnected and on the way
       *  out of a failed start, so a page that has run six calls is running none of them. */
      const stopCallMeters = () => { herMeterStop?.(); meterStop?.(); meterStop = null; };
      /** Her caption doubles as the connection status, so it has to stop being the status the
       *  moment she says anything — and it has to keep moving until then. It used to be written
       *  once, to "Connecting…", and then only ever again by a transcription: a call that
       *  connected but stayed quiet looked identical to a call that never connected at all. */
      const status = (s) => { if (!herSpoke) $("says").textContent = s; };
      async function mint() {
        for (let i = 0; i < 12; i++) {
          const t = performance.now();
          const body = { teacher: chosen,
            ...(voicePreset ? { voicePreset } : {}),
            lastStrand: level.strand, lastDifficulty: level.difficulty, lastAccuracy: save.acc };
          const r = await fetch("/api/call", { method:"POST", headers:{"content-type":"application/json"},
            body: JSON.stringify(body) });
          const ms = Math.round(performance.now()-t);
          if (r.status === 429) { const q = await r.json();
            Trace.http("POST /api/call", body, `429 queued #${q.position}`, ms);
            $("says").textContent = `${q.position ?? "?"} ahead of you, hold on…`;
            await new Promise((s) => setTimeout(s, q.retryAfterMs ?? 2000)); continue; }
          if (!r.ok) { const e = await r.json().catch(() => ({}));
            Trace.err("POST /api/call", `${r.status} ${e.error ?? ""}`);
            throw new Error(r.status === 402 ? "Out of credits" : (e.error ?? `mint failed ${r.status}`)); }
          const g = await r.json();
          Trace.http("POST /api/call", body,
            `voice ${g.voice} · brief ${g.briefChars}/4000 · ${String(g.grant.session_id).slice(0,8)}…`, ms);
          return g;
        }
        throw new Error("still queued after 12 tries");
      }

      $("call").onclick = async () => {
        $("err").textContent = ""; $("call").disabled = true;
        herSpoke = false; herPeak = 0; clearTimeout(silenceTimer);
        status("Connecting…");
        try {
          const b = await (await fetch("/api/budget")).json();
          Trace.http("GET /api/budget","",`${b.secondsLeft}s left`);
          if (!b.enough) throw new Error(`Only ${b.secondsLeft}s of credit left.`);

          const g = await mint();
          sessionId = g.grant.session_id;
          status("Granted. Joining the room…");
          /* `mode` is always "avatar", so a video track is always coming — but it does not
             arrive with the grant. The still stands in until it does, and the ring is the
             speaking cue for exactly that window: an empty frame with audio on it reads as a
             call that failed. */
          let videoUp = false;
          $("her").style.display = "none";
          $("still").style.display = "block";

          room = new Room();
          room.on(RoomEvent.TrackSubscribed, (t, pub, p) => {
            Trace.room("TrackSubscribed", `${t.kind} from ${p?.identity ?? "?"}`);
            if (t.kind === "video") {
              t.attach($("her"));
              videoUp = true;
              $("her").style.display = "block";
              $("still").style.display = "none";
              status("She is on screen."); return;
            }
            t.attach();
            status("She is on air — she speaks first, so give her a moment.");
            /* HER METER HAS TO BE STOPPABLE, and it was not.
               `createAudioAnalyser` hands back a `cleanup` alongside `calculateVolume`; this
               destructured only the second and dropped the first on the floor, and the loop that
               reads it was an IIFE with no handle to cancel. So every call left behind an
               AudioContext, an AnalyserNode and a requestAnimationFrame loop that ran for the
               life of the PAGE — reading an FFT and touching the ring's class every frame, on a
               track that had been dead since the call ended.
               One call, invisible. Start and end six without reloading and six of them are
               running at once, and the seventh click lands on a main thread already spending
               every frame on the corpses of the first six. That is the End button that takes a
               second to notice you. */
            herMeterStop?.();
            const { calculateVolume: herVol, cleanup: herCleanup } =
              createAudioAnalyser(t, { smoothingTimeConstant:.3 });
            let herRaf = 0, ringOn = null;
            (function h() { const v = herVol();
              herPeak = Math.max(herPeak, v);
              // Only write when it changes: `.ring.on` moves a border-width, so a toggle every
              // frame is a layout every frame for a value that changes a few times a sentence.
              const on = v > .02 && !videoUp;
              if (on !== ringOn) { ringOn = on; $("ring").classList.toggle("on", on); }
              herRaf = requestAnimationFrame(h); })();
            herMeterStop = () => {
              cancelAnimationFrame(herRaf);
              herCleanup?.().catch(() => {});
              $("ring").classList.remove("on");
              herMeterStop = null;
            };
          });
          room.on(RoomEvent.TranscriptionReceived, (segs, participant) => {
            const last = segs[segs.length-1];
            if (!last?.text) return;
            /* THE LEARNER IS ON THIS EVENT TOO. Their speech is transcribed and their typed lines
               come back as a turn, and neither carries a label — only the participant does. Without
               this the caption under her face shows the learner their own sentence, attributed to
               her, and `herSpoke` latches on it: the status line then goes quiet believing she has
               started talking when nothing has come out of her yet. */
            if (participant?.identity && participant.identity === room?.localParticipant?.identity) {
              if (last.final !== false && !sentByUs.delete(last.text)) Trace.say(last.text, "you");
              return;
            }
            herSpoke = true; clearTimeout(silenceTimer);
            $("says").textContent = last.text;
            if (last.final === false) return;
            Trace.say(last.text);
            // Tool names have no business in her speech and the page never sees her text stream,
            // so this cannot be filtered — only detected and blamed.
            const leaked = TOOL_NAMES.filter((n) => last.text.includes(n));
            if (leaked.length) Trace.err("tool name spoken aloud", leaked.join(", "));
            /* The other half of the same failure, and the one that actually happened: she read a
               stage direction out. The brief's worked example used to be written as
               `(silently call next_task, then show) "Right - what is five plus two?"`, and she
               said the bracket as well as the line. The example is gone; this catches a relapse. */
            const aside = last.text.match(/\([^)]{0,80}?\b(call|calling|show|showing|silently|tool)\b[^)]{0,80}?\)/i);
            if (aside) Trace.err("stage direction spoken aloud", aside[0]);
            /* The third shape of the same failure, and the newest. The workspace pushes her a
               line prefixed WORKSPACE: when a task is finished; her brief says that line is the
               screen and is never to be read out. If it comes back through the transcript she
               has read the page's own note to the learner. */
            if (/\bworkspace\s*:/i.test(last.text))
              Trace.err("workspace note read aloud", last.text.slice(0, 80));
          });
          room.on(RoomEvent.Disconnected, (r) => { Trace.room("Disconnected", r ?? "");
            clearTimeout(silenceTimer); herSpoke = false; stopCallMeters();
            $("says").textContent = "Session over."; $("call").disabled = false;
            $("leave").disabled = true; room = null; refreshSpend(); });

          const tc = performance.now();
          await room.connect(g.grant.livekit_url, g.grant.participant_token);
          Trace.room("connected", g.grant.room_name, "", Math.round(performance.now()-tc));
          status("In the room. Waiting for her worker…");

          /* TOOLS FIRST, MICROPHONE SECOND, and the order is the whole point.
             Her brief tells her to open the moment the call connects, so by the time we are back
             from `connect` she is already talking and already reaching for `next_task`. Anything
             awaited before the manifest is registered is time she spends calling tools that are
             not there yet — and what that looks like from the outside is a workspace that stays
             empty while she talks, which reads as a page that has hung rather than a race.

             Asking for the microphone is exactly that kind of await: a permission prompt is a
             human deciding, and `enableMicrophone` will wait up to fifteen seconds for one. It
             does not need to hold the tool plane hostage while it does. */
          const tr = performance.now();
          /* If her worker never joins, the likeliest cause that is not capacity is the `voice`
             this call pinned: a provider the key cannot reach takes the render
             side down BEFORE it joins, and the mint said 200 about twenty seconds ago. Nothing
             else on the page can know that, so this is where it gets said. */
          let reg;
          try {
            reg = await attachAvatarTools(room, TOOLS, { timeoutMs:15000 });
          } catch (e) {
            if (!voicePreset) throw e;
            throw new Error(`${e.message ?? e} — this call pinned the voice "${voicePreset}", and `
              + `a voice the render side cannot load stops her worker before it joins. Set the `
              + `voice back to "as assigned" and try again.`);
          }
          Trace.room("tools registered", `${reg.accepted.length} accepted`,
            reg.rejected.length ? `rejected ${JSON.stringify(reg.rejected)}` : `deadline ${TOOL_DEADLINE_MS}ms`,
            Math.round(performance.now()-tr));
          regInfo = { accepted: reg.accepted, rejected: reg.rejected,
                      briefChars: g.briefChars };
          renderTools();
          $("leave").disabled = false;
          status("Ready. She opens — she should greet you and set the first task.");

          /* A refused microphone is no longer fatal. It used to throw, which killed a call that
             had already connected and published her video — and back then that was honest, because
             without a microphone there was no way to answer. There is a box under the board now,
             so a missing microphone costs one input out of four and the lesson goes ahead.

             THE CALL USES A DEVICE THAT WAS PROVEN, OR THE SYSTEM DEFAULT. `micChoice` is set
             only when a meter has actually heard signal on an input, or when someone picked one
             by hand. It is deliberately NOT the boot heuristic's guess: that guess ranks labels,
             labels are localised, and forcing a guessed input onto the call can replace a working
             default with a silent one — which is a worse bug than the one it was trying to avoid.
             With nothing proven the call takes the system default, exactly as it did before, and
             the meter says within three seconds if that was wrong. */
          const enableMic = (deviceId) => enableMicrophone({ localParticipant: {
            setMicrophoneEnabled: () => room.localParticipant.setMicrophoneEnabled(
              true, deviceId ? { deviceId: { exact: deviceId } } : {}),
          } });
          /* Hand the device over first. The self-test track is still holding it, and on hardware
             that does not share an input that is the difference between a call with a microphone
